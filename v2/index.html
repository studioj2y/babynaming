<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>星命观测局 · 2.0</title>
<style>
  @property --accent{syntax:'<color>';inherits:true;initial-value:#8a6fb0}
  @property --accent2{syntax:'<color>';inherits:true;initial-value:#6a4f97}
  @property --glow{syntax:'<color>';inherits:true;initial-value:rgba(150,110,210,.22)}
  :root{
    --bg:#f5f3fa; --bg2:#e6def2;
    --ink:#2b2735; --ink-soft:#6b6380;
    --panel:rgba(255,255,255,.80); --panel-line:rgba(60,40,90,.12);
    --accent:#8a6fb0; --accent2:#6a4f97; --glow:rgba(150,110,210,.22);
    --theme-t:.5s;
    --sat:100%;                       /* 颜色饱和度：随流程递进（#6 需求） */
    --aura:rgba(255,255,255,.95); --aura-soft:rgba(244,240,252,.60);
    --radius:18px;
    --actor-bottom:38%; --actor-h:42vh; --actor-max:360px;   /* 立绘位置/尺寸，按场景经 JS 调整 */
    --ease:cubic-bezier(.22,.61,.36,1);
    transition:--accent var(--theme-t) var(--ease),--accent2 var(--theme-t) var(--ease),--glow var(--theme-t) var(--ease);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0}
  body{
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
    color:var(--ink);
    overflow:hidden;
  }
  /* 背景层单独承载饱和度滤镜：body 不再整体滤镜，避免把首屏落叶也压暗成黑白 */
  #bg{position:fixed;inset:0;z-index:0;pointer-events:none;
    background:radial-gradient(120% 80% at 50% -10%,var(--bg2),var(--bg) 60%);
    filter:saturate(var(--sat));transition:filter .7s var(--ease);}
  /* 星尘背景 */
  #stars{position:fixed;inset:0;pointer-events:none;z-index:0;
    background:
      radial-gradient(2px 2px at 20% 30%,rgba(123,92,170,.40),transparent),
      radial-gradient(1.5px 1.5px at 70% 20%,rgba(123,92,170,.30),transparent),
      radial-gradient(1.5px 1.5px at 40% 70%,rgba(123,92,170,.28),transparent),
      radial-gradient(2px 2px at 85% 60%,rgba(123,92,170,.34),transparent),
      radial-gradient(1px 1px at 55% 45%,rgba(123,92,170,.28),transparent);
    animation:drift 18s linear infinite alternate;
    filter:saturate(var(--sat));transition:filter .7s var(--ease);}
  @keyframes drift{to{transform:translateY(-12px)}}

  /* 环境氛围层：低透明度闪烁星点 + 随机运动圆环 + 若隐若现光晕 + 不断变化星座线；置于空白区、不挡内容 */
  #ambient{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
  #ambient .astar{position:absolute;border-radius:50%;background:#fff;opacity:0;
    animation:twinkle var(--tw,4s) ease-in-out infinite}
  @keyframes twinkle{0%,100%{opacity:0;transform:scale(.6)}50%{opacity:var(--op,.5);transform:scale(1)}}
  #ambient .aring{position:absolute;border-radius:50%;border:1px solid var(--panel-line);opacity:.12;
    animation:ringMove var(--rm,22s) linear infinite}
  @keyframes ringMove{0%{transform:translate(0,0) rotate(0)}100%{transform:translate(var(--dx,40px),var(--dy,-30px)) rotate(360deg)}}
  #ambient .aglow{position:absolute;border-radius:50%;
    background:radial-gradient(circle,var(--gc,var(--glow)),transparent 70%);opacity:0;
    animation:glowPulse var(--gp,9s) ease-in-out infinite}
  @keyframes glowPulse{0%,100%{opacity:0;transform:scale(.85)}50%{opacity:var(--op,.16);transform:scale(1.12)}}
  /* 星座线：周期重构之间也保持缓慢漂移，不完全静止 */
  #ambient .aconst{animation:constDrift 13s ease-in-out infinite alternate;transform-origin:50% 50%}
  @keyframes constDrift{0%{transform:translate(-22px,14px) rotate(-4deg)}100%{transform:translate(22px,-16px) rotate(4deg)}}

  #leaves{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
  .leaf{position:absolute;top:-24px;width:14px;height:16px;
    background:linear-gradient(160deg,var(--accent),var(--accent2));
    border-radius:0 80% 0 80%/0 80% 0 80%;
    animation:fall linear forwards;filter:drop-shadow(0 0 4px var(--glow)) drop-shadow(0 1px 1px rgba(60,40,90,.2))}
  @keyframes fall{
    0%{transform:translateY(-24px) translateX(0) rotate(0deg) scale(.9);opacity:0}
    8%{opacity:.55}                /* 落叶透明度：明显可见但仍不抢戏 */
    30%{transform:translateY(30vh) translateX(calc(var(--drift,30px)*.28)) rotate(135deg) scale(1)}
    62%{transform:translateY(63vh) translateX(calc(var(--drift,30px)*.62)) rotate(290deg) scale(1.04)}
    88%{opacity:.5}
    100%{transform:translateY(106vh) translateX(var(--drift,30px)) rotate(430deg) scale(.92);opacity:0}
  }

  #app{position:relative;z-index:1;height:100%;display:flex;flex-direction:column;
    max-width:520px;margin:0 auto;padding:env(safe-area-inset-top) 18px env(safe-area-inset-bottom);}  /* 立绘(#actorWrap)与内容(#stage)的容器；饱和度滤镜只罩 #stage/#top，立绘不受递进影响 */

  /* 立绘层（#4：上移以避免与气泡重叠） */
  #actorWrap{position:absolute;left:0;right:0;bottom:var(--actor-bottom);display:flex;justify-content:center;align-items:flex-end;gap:6px;padding:0 8px;
    pointer-events:none;z-index:1;}
  .actor{height:var(--actor-h);max-height:var(--actor-max);width:auto;object-fit:contain;
    filter:blur(10px) drop-shadow(0 0 18px var(--aura)) drop-shadow(0 0 42px var(--aura-soft)) drop-shadow(0 8px 14px rgba(70,50,100,.16));
    opacity:0;transform:translateY(40px) scale(1.2);}  /* 隐藏态=淡出终态(scale1.2+下移40)，淡入为其镜像 */
  .actor.show{animation:actorEnter .52s var(--ease) both;
    filter:drop-shadow(0 0 18px var(--aura)) drop-shadow(0 0 42px var(--aura-soft)) drop-shadow(0 8px 14px rgba(70,50,100,.16));}
  .actor.leave{animation:actorLeave .28s var(--ease) both;
    filter:blur(10px) drop-shadow(0 0 18px var(--aura)) drop-shadow(0 0 42px var(--aura-soft)) drop-shadow(0 8px 14px rgba(70,50,100,.16));}
  @keyframes actorEnter{   /* 淡入：与 actorLeave 互为镜像；起点略大于终态，动感更强 */
    0%{opacity:0;transform:translateY(40px) scale(1.2);filter:blur(10px) drop-shadow(0 0 18px var(--aura)) drop-shadow(0 0 42px var(--aura-soft)) drop-shadow(0 8px 14px rgba(70,50,100,.16))}
    55%{opacity:1}
    100%{opacity:1;transform:translateY(0) scale(1);filter:drop-shadow(0 0 18px var(--aura)) drop-shadow(0 0 42px var(--aura-soft)) drop-shadow(0 8px 14px rgba(70,50,100,.16))}}
  @keyframes actorLeave{
    0%{opacity:1;transform:translateY(0) scale(1);filter:drop-shadow(0 0 18px var(--aura)) drop-shadow(0 0 42px var(--aura-soft)) drop-shadow(0 8px 14px rgba(70,50,100,.16))}
    100%{opacity:0;transform:translateY(40px) scale(1.2);filter:blur(10px) drop-shadow(0 0 18px var(--aura)) drop-shadow(0 0 42px var(--aura-soft)) drop-shadow(0 8px 14px rgba(70,50,100,.16))}}
  .actor.pair{height:34vh;max-height:300px}

  /* 表演立绘层：与 #actorWrap 同级（在 #stage 滤镜之外），故表演阶段立绘也保持满色、不受饱和度递进影响 */
  /* 表演立绘层：与 #actorWrap 同级（在 #stage 滤镜之外），故表演阶段立绘也保持满色、不受饱和度递进影响；bottom:34% 让单/双立绘(42vh)与底部文字/按钮之间留出明确空隙，避免遮挡 */
  #ritualWrap{display:none;position:absolute;left:0;right:0;bottom:34%;justify-content:center;align-items:flex-end;gap:10px;padding:0 8px;pointer-events:none;z-index:1;}  /* z-index 低于 #stage(2)：表演对话泡(#ritual .bubble)显示在立绘上层，由对话泡遮挡立绘 */

  /* 顶部品牌条 */
  #top{display:flex;align-items:center;gap:8px;padding:14px 4px 6px;z-index:3;color:var(--ink-soft);font-size:13px;letter-spacing:.18em;filter:saturate(var(--sat));transition:filter .7s var(--ease)}
  #top b{color:var(--accent);font-weight:600;letter-spacing:.22em;cursor:pointer;transition:opacity .2s}
  #top b:hover{opacity:.7}
  #step{margin-left:auto;font-size:12px;opacity:.7;letter-spacing:.05em}

  /* 场景舞台 */
  #stage{flex:1;display:flex;flex-direction:column;justify-content:flex-end;z-index:2;
    padding-bottom:8px;min-height:0;position:relative;filter:saturate(var(--sat));transition:filter .7s var(--ease);}  /* 饱和度只作用于页面内容(气泡/按钮/文字)；立绘(#actorWrap)为同级兄弟，不受递进影响 */
  #scene{position:relative;flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;
    overflow-y:auto;                /* #2 需求：内容超高时可滚动，避免「揭晓」按钮被裁出可视区 */
    transition:opacity .32s var(--ease),transform .32s var(--ease);}
  #scene.out{opacity:0;transform:translateX(-26px)}
  #scene.in{opacity:0;transform:translateX(26px)}
  .scene--fixed{position:absolute;inset:0}
  .scene--fixed .bLayer{position:absolute;left:0;right:0;bottom:30%}
  .scene--fixed .cLayer{position:absolute;left:0;right:0;bottom:max(14px,env(safe-area-inset-bottom))}
  /* 汇总表：内容压到下方，避开上方抬高的星师立绘 */
  .scene--summary{justify-content:flex-end;padding-bottom:52px}

  /* 对话气泡（漫画风） */
  .bubble{background:var(--panel);border:1.5px solid var(--panel-line);border-radius:var(--radius);
    padding:16px 18px 18px;backdrop-filter:blur(8px);box-shadow:0 10px 30px rgba(70,50,100,.20);
    font-size:16px;line-height:1.6;color:var(--ink);position:relative;}
  .bubble::before{content:"";position:absolute;top:-7px;left:50%;width:13px;height:13px;margin-left:-6.5px;
    background:var(--panel);border-left:1.5px solid var(--panel-line);border-top:1.5px solid var(--panel-line);
    transform:rotate(45deg);border-top-left-radius:4px}
  .bubble.no-arrow::before{display:none}  /* 无立绘的对话泡（如过目确认框）去掉指向箭头 */
  .bubble .who{display:block;font-size:12px;letter-spacing:.16em;color:var(--accent);margin-bottom:8px;font-weight:600}
  .bubble p{margin:0}
  .bubble p .tw-cursor{display:inline-block;width:2px;height:1em;background:var(--accent);margin-left:2px;vertical-align:text-bottom;animation:blink .6s step-end infinite}
  @keyframes blink{50%{opacity:0}}

  /* 输入控件 */
  .ask{margin-top:14px;display:flex;flex-direction:column;gap:10px}
  .field label{display:block;font-size:12px;color:var(--ink-soft);margin-bottom:5px;letter-spacing:.05em}
  .field input{width:100%;background:rgba(255,255,255,.65);border:1px solid var(--panel-line);
    border-radius:12px;padding:12px 14px;color:var(--ink);font-size:16px;outline:none;transition:border-color .2s}
  .field input:focus{border-color:var(--accent)}
  .fields-row{display:flex;gap:12px}
  .fields-row .field{flex:1;min-width:0}
  .seg{display:flex;gap:8px;flex-wrap:wrap}
  .seg button{flex:1;min-width:84px;background:rgba(255,255,255,.60);border:1px solid var(--panel-line);
    color:var(--ink-soft);border-radius:12px;padding:12px 8px;font-size:15px;cursor:pointer;
    transition:all .2s var(--ease)}
  .seg button.sel{background:linear-gradient(160deg,var(--accent),var(--accent2));
    color:#fff;border-color:transparent;box-shadow:0 6px 18px var(--glow)}
  .hint{font-size:12px;color:var(--ink-soft);opacity:.8;margin-top:2px}

  .btn{margin-top:16px;width:100%;border:none;border-radius:14px;padding:14px;font-size:16px;
    font-weight:600;color:#fff;cursor:pointer;background:linear-gradient(160deg,var(--accent),var(--accent2));
    box-shadow:0 8px 22px var(--glow);transition:transform .15s,opacity .2s,filter .2s;letter-spacing:.05em}
  .btn:active{transform:scale(.98)}
  .btn:disabled{opacity:.4;filter:grayscale(.4);cursor:not-allowed;box-shadow:none}
  .btn.ghost{background:rgba(255,255,255,.55);border:1px solid var(--panel-line);box-shadow:0 4px 14px rgba(70,50,100,.10);color:var(--ink-soft)}
  /* 主题色渐变过渡 */
  .btn,.seg button,.bubble,.field input,#top b,.orbit,.brand .logo{
    transition:background-color var(--theme-t) var(--ease),border-color var(--theme-t) var(--ease),
      color var(--theme-t) var(--ease),box-shadow var(--theme-t) var(--ease),transform .15s,opacity .2s,filter .2s}

  /* 汇总过目表 */
  .summary{background:var(--panel);border:1px solid var(--panel-line);border-radius:var(--radius);
    padding:4px;backdrop-filter:blur(8px);box-shadow:0 10px 30px rgba(70,50,100,.18);overflow:hidden;margin-top:14px}
  .sumrow{display:flex;align-items:center;gap:10px;padding:11px 12px;border-bottom:1px solid var(--panel-line)}
  .sumrow:last-child{border-bottom:none}
  .sumrow .sk{font-size:12px;color:var(--ink-soft);letter-spacing:.08em;width:64px;flex:none}
  .sumrow .sv{flex:1;font-size:15px;color:var(--ink);word-break:break-all}
  .sumrow .sv.empty{color:var(--ink-soft);opacity:.6}
  .sumrow .edit{flex:none;border:none;background:linear-gradient(160deg,var(--accent),var(--accent2));
    color:#fff;border-radius:10px;padding:7px 14px;font-size:13px;cursor:pointer;transition:transform .15s}
  .sumrow .edit:active{transform:scale(.94)}

  /* 品牌开场 */
  #brand{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:0 18px}
  #brand .logo{font-size:30px;letter-spacing:.4em;color:var(--accent);font-weight:700;
    text-shadow:0 0 24px var(--glow);animation:logoIn 1.1s var(--ease) both}
  #brand .sub{margin-top:14px;color:var(--ink-soft);font-size:14px;letter-spacing:.2em;opacity:0;animation:fadeUp .9s .5s var(--ease) both}
  @keyframes logoIn{from{opacity:0;letter-spacing:.9em;filter:blur(6px)}to{opacity:1}}
  @keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:.9;transform:none}}

  /* 占算：立绘在上、文字在下；旋转大圆沉到最下、不再与立绘/文字重叠（#3 需求） */
  #ritual{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;
    min-height:100%;gap:12px;text-align:center;padding-bottom:54px;overflow:hidden}
  .ritualStage{position:relative;z-index:1;width:100%;flex:1;min-height:0;
    display:flex;align-items:center;justify-content:center;padding-top:4px}
  .ritualActor{height:42vh;width:auto;max-width:95vw;object-fit:contain;opacity:0;  /* 锁定高度，宽度随比例自适应，消除高低差 */
    transform:translateY(34px) scale(1.1);
    filter:drop-shadow(0 0 20px var(--aura)) drop-shadow(0 0 46px var(--aura-soft)) drop-shadow(0 8px 16px rgba(70,50,100,.18))}
  .ritualActor.show{animation:ritualEnter .5s var(--ease) both}
  .ritualActor.leave{animation:ritualLeave .26s var(--ease) both}
  @keyframes ritualEnter{
    0%{opacity:0;transform:translateY(34px) scale(1.1)}
    55%{opacity:1}
    100%{opacity:1;transform:translateY(0) scale(1)}}
  @keyframes ritualLeave{
    0%{opacity:1;transform:translateY(0) scale(1)}
    100%{opacity:0;transform:translateY(34px) scale(1.1)}}
  .ritualActor.pair{height:42vh;max-width:46%}  /* 单/双统一锁定高度，比例一致 */
  #ritual .bubble{position:relative;z-index:2;max-width:30em;margin:0 auto 44px;text-align:left;   /* margin-bottom 把对话泡略抬高，远离底部 */
    min-height:3.2em;transition:opacity .4s var(--ease)}
  #ritual .bubble.fade{opacity:0}
  #ritual .bubble .who{text-align:left}
  /* 旋转光环：放到 #ritual 底部、降低不透明度、降低 z-index；不再压在立绘/文字上 */
  .orbit{position:absolute;left:0;right:0;bottom:-50px;margin:0 auto;
    width:230px;height:230px;border-radius:50%;
    border:1px solid var(--panel-line);
    background:conic-gradient(from 0deg,transparent,var(--glow),transparent);
    animation:spin 14s linear infinite;box-shadow:0 0 50px var(--glow);
    opacity:.35;z-index:0;pointer-events:none}
  .orbit::after{content:"";position:absolute;inset:54px;border-radius:50%;
    background:radial-gradient(circle,var(--accent),transparent 70%);opacity:.4}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* 静待揭晓（#2：内容包进 #waitWrap，margin:auto 居中且超高可滚动，保证「揭晓」按钮永远可达） */
  #waitWrap{width:100%;margin:auto;padding:12px 0;text-align:center}
  #wait .crow{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;margin:18px 0 10px}
  #wait .crow img{width:38px;height:54px;object-fit:cover;object-position:top;border-radius:8px;
    opacity:.9;border:1px solid var(--panel-line);filter:drop-shadow(0 0 7px var(--aura-soft)) drop-shadow(0 4px 8px rgba(70,50,100,.18))}
  #wait .tip{color:var(--ink-soft);font-size:14px;letter-spacing:.1em;margin-top:6px}
  .spinner{width:30px;height:30px;border:3px solid var(--panel-line);border-top-color:var(--accent);
    border-radius:50%;margin:20px auto;animation:spin 1s linear infinite}

  /* 揭晓光效 */
  #flash{position:fixed;inset:0;z-index:9;pointer-events:none;opacity:0;
    background:radial-gradient(circle at 50% 60%,rgba(255,247,220,.9),transparent 55%);
    transition:opacity .25s ease}
  #flash.on{opacity:1}
  #flash.white{background:#fff}   /* 揭晓前光球炸开时的全白屏 */

  /* 揭晓前光球汇聚动效：数枚光球从屏幕外螺旋旋入中心 → 炸开 → 白屏 → 按钮出现 */
  #orbFx{position:fixed;inset:0;z-index:8;pointer-events:none;display:none;overflow:hidden}
  #orbFx.go{display:block}
  #orbFx .orb{position:absolute;left:50%;top:50%;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;opacity:0;
    background:radial-gradient(circle,#fff,var(--glow) 55%,transparent 72%);
    box-shadow:0 0 22px var(--glow),0 0 48px rgba(255,255,255,.55);
    transform:rotate(var(--ang,0deg)) translateX(150vw)}
  #orbFx.go .orb{animation:orbIn 1.35s var(--ease) forwards}
  @keyframes orbIn{
    0%{opacity:0;transform:rotate(var(--ang,0deg)) translateX(150vw)}
    18%{opacity:1}
    100%{opacity:1;transform:rotate(calc(var(--ang,0deg) + 720deg)) translateX(0)}
  }
  #orbFx .orb.boom{animation:orbBoom .5s ease-out forwards}
  @keyframes orbBoom{0%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(6)}}

  /* 揭晓按钮按下：光球自按钮中心飞出 → 围成圆环旋转约1秒 → 炸开 */
  #revealOrbFx{position:fixed;inset:0;z-index:8;pointer-events:none;display:none;overflow:visible}
  #revealOrbFx.go{display:block}
  #revealOrbFx .orb{position:absolute;width:20px;height:20px;margin:-10px 0 0 -10px;border-radius:50%;opacity:0;
    background:radial-gradient(circle,#fff,var(--glow) 55%,transparent 72%);
    box-shadow:0 0 18px var(--glow),0 0 40px rgba(255,255,255,.5);
    transform:rotate(var(--ang,0deg)) translateX(0)}
  #revealOrbFx.go .orb{animation:orbReveal 1.3s var(--ease) forwards}
  @keyframes orbReveal{
    0%{opacity:0;transform:rotate(calc(var(--ang,0deg) + 0deg)) translateX(0)}
    12%{opacity:1}
    30%{transform:rotate(calc(var(--ang,0deg) + 0deg)) translateX(var(--R,110px))}
    100%{opacity:1;transform:rotate(calc(var(--ang,0deg) + 360deg)) translateX(var(--R,110px))}
  }
  #revealOrbFx .orb.boom{animation:orbRevealBoom .5s ease-out forwards}
  @keyframes orbRevealBoom{
    0%{opacity:1;transform:rotate(calc(var(--ang,0deg) + 360deg)) translateX(var(--R,110px)) scale(1)}
    100%{opacity:0;transform:rotate(calc(var(--ang,0deg) + 360deg)) translateX(var(--R,110px)) scale(5)}
  }

  /* 结果木牌 */
  #result{position:absolute;top:0;bottom:0;left:0;right:0;z-index:5;overflow-y:auto;
    max-width:440px;margin:0 auto;padding:8px 12px 20px;
    background:linear-gradient(180deg, rgba(247,245,251,.82), rgba(236,232,246,.90));   /* 半透明：透出首页星野/氛围背景，结果页背景类首页 */
    opacity:0;transform:translateY(20px);transition:opacity .5s var(--ease),transform .5s var(--ease);
    pointer-events:none;}

const state = {scene:null, branch:"A", _birthHour:12};
let apiPromise = null;
const $ = (s)=>document.querySelector(s);
const sceneEl = $("#scene");

function setTheme(g){
  const root = document.documentElement.style;
  if(g==="M"){ root.setProperty("--accent","#6f86c4"); root.setProperty("--accent2","#3f4d86"); root.setProperty("--glow","rgba(110,140,220,.26)"); }
  else if(g==="F"){ root.setProperty("--accent","#d4749a"); root.setProperty("--accent2","#a85379"); root.setProperty("--glow","rgba(220,130,175,.28)"); }
  else { root.setProperty("--accent","#8a6fb0"); root.setProperty("--accent2","#6a4f97"); root.setProperty("--glow","rgba(150,110,210,.22)"); }
}
/* 立绘过渡时长(ms)：EXIT_MS 须 ≥ .actor 的 transition(.38/.42s)；ENTRANCE 为登场淡入完成时长方用于"门控内容出现" */
const EXIT_MS = 280;
const ENTRANCE = 430;
function showActors(list, opts){
  opts = opts || {};
  const wrap = $("#actorWrap");
  const items = (Array.isArray(list)?list:[list]).filter(Boolean).map(x => typeof x==="string" ? {key:x} : x);
  const sig = items.map(i=>i.key+(i.src?"~"+i.src:"")).join("|");
  if(wrap.dataset.sig===sig){ if(opts.onEntered) opts.onEntered(); return; }
  wrap.dataset.sig = sig;
  wrap.querySelectorAll(".actor").forEach(a=>{ a.classList.remove("show"); a.classList.add("leave"); });   // 触发镜像淡出(actorLeave)过渡
  setTimeout(()=>{
    if(!items.length){ wrap.innerHTML=""; if(opts.onEntered) opts.onEntered(); return; }
    wrap.innerHTML = items.map(i=>'<img class="actor'+(items.length>1?' pair':'')+'" src="'+(i.src||CHAR[i.key].file)+'" alt="'+(CHAR[i.key].name||"")+'" data-key="'+i.key+'">').join("");
    requestAnimationFrame(()=>wrap.querySelectorAll(".actor").forEach(a=>a.classList.add("show")));
    setTimeout(()=>{ if(opts.onEntered) opts.onEntered(); }, 30+ENTRANCE);  // 登场过渡完成后再回调
  }, EXIT_MS);
}
function showActor(key, src, onEntered){
  const item = key ? (src ? {key, src} : {key}) : null;
  showActors(item?[item]:[], {onEntered});
}
function rnd(a){ return a[Math.floor(Math.random()*a.length)]; }
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); const t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
function typeText(el, text, speed, onDone){
  el.textContent = "";
  let i = 0;
  const cur = document.createElement("span"); cur.className = "tw-cursor"; el.appendChild(cur);
  const t = setInterval(()=>{
    if(i < text.length){ cur.insertAdjacentText("beforebegin", text[i]); i++; }
    else { clearInterval(t); if(cur.parentNode) cur.remove(); if(onDone) onDone(); }
  }, speed || 35);
}

function go(id){
  const sc = SCENES[id];
  state.scene = id;
  /* 落叶贯穿全程：切换场景不清空，由各自动画时长自然移除 */
  $("#ritualWrap").style.display="none";  // 非表演场景隐藏表演立绘层（表演阶段由 enterRitual 重新打开）
  if(!sc) return;
  /* #6 饱和度按场次递进 */
  if(SAT[id] !== undefined) document.documentElement.style.setProperty("--sat", SAT[id]+"%");
  if(sc.kind==="ritual"){ enterRitual(); return; }
  if(id==="s10" && !state.result){
    renderWait(true);
    apiPromise.then(()=>renderWait(false)).catch(()=>renderWait(false));
    return;
  }
  renderScene(sc);
}

/* 从汇总表点"改"后再确认，应回到汇总而非继续走原流程 */
function proceed(sc){
  if(state.editReturn){ const t=state.editReturn; state.editReturn=null; go(t); }
  else go(sc.next);
}
/* 生辰/八字弹窗「继续」：从汇总表「改」返回时回到汇总；否则 A 线回主理序(s08c)，B 线回汇总(s_summary) */
function _returnTarget(){
  if(state.editReturn){ const t=state.editReturn; state.editReturn=null; return t; }
  return state.branch==="B" ? "s_summary" : "s08c";
}
/* 点击左上"星命观测局"回到首页，重置整段流程 */
function goHome(){
  clearTimeout(state._rt);
  state._revealing=false;
  state.editReturn=null;
  ["father","mother","mode","name_len","gender","name","result","birth","birthText","_birthDate","_birthHour","primaryTeacher","_carouselList","_teacherIdx","bazi"].forEach(k=>delete state[k]);
  state.branch="A";
  apiPromise = Promise.resolve();
  $("#actorWrap").style.display="";
  showActors([]);
  $("#step").textContent="";
  go("brand");
}
$("#top").querySelector("b").onclick = goHome;

function transitionTo(html, after){
  sceneEl.classList.add("out");
  setTimeout(()=>{
    sceneEl.innerHTML = html;
    sceneEl.classList.remove("out"); sceneEl.classList.add("in");
    requestAnimationFrame(()=>{ sceneEl.classList.remove("in"); if(after) after(); });
  }, 300);
}

/* ---------- 主理老师轮播（一位一张卡 + 左右箭头 + 星师综合底部按钮） ---------- */
function teacherCarouselList(){
  const list = TEACHER_PICK.slice();
  if(!state.birth){                            /* 未填生辰时，生肖老师不出现 */
    const i = list.findIndex(t=>t.v==="shengxiao");
    if(i>=0) list.splice(i,1);
  }
  return list;
}
function renderCarousel(sc){
  const list = teacherCarouselList();
  state._carouselList = list;
  state._teacherIdx = 0;
  const cur = list[0];
  const cardHtml = '<div class="tCard" id="tCard"><div class="tDim">'+cur.dim+'</div></div>';
  transitionTo(
    '<div class="bLayer"><div class="bubble"><span class="who">'+cur.name+'</span><p class="tw-line"></p></div></div>'+
    '<div class="cLayer"><div class="carousel"><button class="arrow" id="arrL" aria-label="上一位">‹</button>'+
      cardHtml+'<button class="arrow" id="arrR" aria-label="下一位">›</button></div>'+
    '<button class="btn pickBtn" id="pickBtn">选定这位老师</button>'+
    '<button class="balanceBtn" id="balanceBtn">星师综合（均衡无偏）</button></div>',
    ()=>{
      showActor(cur.v);                         /* 立绘切到当前主老师 */
      const p = sceneEl.querySelector(".tw-line");
      typeText(p, TEACHER_GUIDE[cur.v], 38);
      sceneEl.querySelector("#arrL").onclick = ()=>moveCarousel(-1);
      sceneEl.querySelector("#arrR").onclick = ()=>moveCarousel(+1);
      sceneEl.querySelector("#pickBtn").onclick = ()=>{ state.primaryTeacher = list[state._teacherIdx].v; proceed(sc); };
      sceneEl.querySelector("#balanceBtn").onclick = ()=>{ state.primaryTeacher = "balance"; proceed(sc); };
    }
  );
}
function moveCarousel(delta){
  const list = state._carouselList;
  if(!list || !list.length) return;
  let idx = (state._teacherIdx + delta + list.length) % list.length;
  const card = sceneEl.querySelector("#tCard");
  if(!card){ state._teacherIdx = idx; const cur = list[idx]; showActor(cur.v);
    const who = sceneEl.querySelector(".bubble .who"); if(who) who.textContent = cur.name;
    const tw = sceneEl.querySelector(".tw-line"); if(tw){ tw.textContent=""; typeText(tw, TEACHER_GUIDE[cur.v], 38); } return; }
  card.classList.add("fade-out");
  setTimeout(()=>{
    state._teacherIdx = idx;
    const cur = list[idx];
    const td = card.querySelector(".tDim"); if(td) td.textContent = cur.dim;
    card.classList.remove("fade-out");
    showActor(cur.v);                            /* 立绘同步切换，触发镜像淡入过渡 */
    const who = sceneEl.querySelector(".bubble .who"); if(who) who.textContent = cur.name;
    const tw = sceneEl.querySelector(".tw-line"); if(tw){ tw.textContent=""; typeText(tw, TEACHER_GUIDE[cur.v], 38); }
  }, 350);
}
function fetchBazi(){
  if(!state.birth){ state.bazi=null; return Promise.resolve(null); }
  return fetch("/api/bazi",{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({birth:state.birth})}).then(r=>r.json()).then(bz=>{
      if(bz && !bz.error) state.bazi = bz;
      return bz;
    }).catch(()=>null);
}

function renderScene(sc){
  $("#step").textContent = sc.step || "";
  sceneEl.classList.toggle("scene--fixed", sc.kind==="talk"||sc.kind==="ask"||sc.kind==="branch"||sc.kind==="carousel");
  sceneEl.classList.toggle("scene--summary", sc.kind==="summary");
  /* 立绘位置/尺寸：汇总表时星师抬到上方并缩小，其余场景用默认（#1/#2） */
  const _rd = document.documentElement.style;
  if(sc.kind==="summary"){ _rd.setProperty("--actor-bottom","66%"); _rd.setProperty("--actor-h","26vh"); _rd.setProperty("--actor-max","220px"); }
  else if(sc.kind==="ask"){ _rd.setProperty("--actor-bottom","44%"); _rd.setProperty("--actor-h","42vh"); _rd.setProperty("--actor-max","360px"); }
  else if(sc.kind!=="ritual"){ _rd.setProperty("--actor-bottom","38%"); _rd.setProperty("--actor-h","42vh"); _rd.setProperty("--actor-max","360px"); }
  /* 登场门控：内容(气泡/输入)待立绘登场完成后再出现；小助理按场景切换立绘 */
  state._actorReady=false; state._onActor=null;
  /* 轮播场景：立绘直接设为轮播第一位老师，避免先显星师再切换的闪烁 */
  let _actorKey = sc.actor;
  if(sc.kind==="carousel"){ _actorKey = teacherCarouselList()[0].v; }
  if(_actorKey!==undefined){
    const src = (_actorKey==="assistant" && ASS_PORTRAIT[state.scene]) ? ASS_PORTRAIT[state.scene] : null;
    showActor(_actorKey, src, ()=>{ state._actorReady=true; const f=state._onActor; state._onActor=null; if(f) f(); });
  }
  if(sc.kind==="brand") return renderBrand(sc);
  if(sc.kind==="talk") return renderTalk(sc);
  if(sc.kind==="branch") return renderBranch(sc);
  if(sc.kind==="ask") return renderAsk(sc);
  if(sc.kind==="carousel") return renderCarousel(sc);
  if(sc.kind==="summary"){ $("#actorWrap").style.display="none"; return renderSummary(sc); }  /* 汇总表界面去掉星师立绘，确保表单清晰 */
  if(sc.kind==="wait") return renderWait(false);
}

function renderBrand(sc){
  sceneEl.innerHTML = '<div id="brand"><div class="logo">星命观测局</div><div class="sub">为小星主，参一名</div>'+
    '<button class="btn" style="margin-top:26px;max-width:200px;margin-left:auto;margin-right:auto">进 入</button></div>';
  sceneEl.querySelector(".btn").onclick = ()=>go(sc.next);
}

function renderTalk(sc){
  const line = rnd(sc.lines);
  transitionTo('<div class="bLayer"><div class="bubble"><span class="who">'+(sc.actor?CHAR[sc.actor].name:"")+'</span><p class="tw-line"></p></div></div>'+
    '<div class="cLayer"><button class="btn" disabled>继 续</button></div>', ()=>{
    const p = sceneEl.querySelector(".tw-line");
    const btn = sceneEl.querySelector(".btn");
    const revealContent = ()=>{
      typeText(p, line, 38, ()=>{ btn.disabled=false; });
      btn.onclick = ()=>proceed(sc);
    };
    if(state._actorReady) revealContent(); else state._onActor = revealContent;  // 立绘登场完成后再出气泡
  });
}

function renderBranch(sc){
  const line = rnd(sc.lines);
  let btns = sc.branch.map((b,i)=>'<button class="btn'+(i>0?' ghost':'')+'" data-i="'+i+'" disabled>'+b.label+'</button>').join("");
  const html='<div class="bLayer"><div class="bubble"><span class="who">'+CHAR[sc.actor].name+'</span><p class="tw-line"></p></div></div><div class="cLayer">'+btns+'</div>';
  transitionTo(html, ()=>{
    const p = sceneEl.querySelector(".tw-line");
    const revealContent = ()=>{
      typeText(p, line, 38, ()=>{
        sceneEl.querySelectorAll(".btn[data-i]").forEach(btn=>{
          btn.disabled=false;
          btn.onclick = ()=>{ const b = sc.branch[+btn.dataset.i]; if(b.set) Object.assign(state,b.set); go(b.next); };
        });
      });
    };
    if(state._actorReady) revealContent(); else state._onActor = revealContent;
  });
}

function renderAsk(sc){
  const a = sc.ask;
  const line = rnd(sc.lines);
  const fields = a.fields || (a.field ? [{field:a.field, label:a.label||"", ph:a.ph||""}] : []);
  let inner = "", extraBtn = "";
  if(a.widget==="seg"){
    inner = '<div class="seg">'+a.options.map(o=>'<button data-v="'+o.v+'">'+o.label+'</button>').join("")+'</div>';
    if(a.theme) inner += '<div class="hint">选择即定主题气韵</div>';
  } else if(a.widget==="birth"){
    const hr = [];
    for(let h=0; h<24; h++){ const sel = (state._birthHour===h)?' selected':''; hr.push('<option value="'+h+'"'+sel+'>'+h+' 时</option>'); }
    inner = '<div class="fields-row birthWrap"><div class="field"><label>出生日期</label>'+
      '<input type="date" data-f="birthdate" value="'+(state._birthDate||"")+'" /></div>'+
      '<div class="field"><label>时辰</label><select data-f="birthhour">'+hr.join("")+'</select></div></div>';
    if(a.optional) extraBtn = '<button class="btn ghost skip">暂不观察生辰八字</button>';
  } else if(a.widget==="bazi"){
    const bz = state.bazi;
    if(bz){
      const gz = (bz.gz||[]).join(" ");
      const dm = bz.day_master ? (bz.day_master + (bz.day_master_wx||"")) : "—";
      const strong = ({"旺":"身旺","弱":"身弱","中和":"中和"}[bz.strong]) || "—";
      const useg = (bz.use_gods||[]).join("、") || "—";
      const zod = bz.zodiac ? ("生肖 "+bz.zodiac) : "";
      inner = '<div class="baziCard baziDialog"><div class="bk-title">命盘参详</div>'+
        '<div class="bk-row"><span class="bk-k">八字</span><span class="bk-v bk-gz">'+gz+'</span></div>'+
        '<div class="bk-row"><span class="bk-k">日主</span><span class="bk-v">'+dm+'</span>'+
        '<span class="bk-k">旺衰</span><span class="bk-v">'+strong+'</span></div>'+
        '<div class="bk-row"><span class="bk-k">喜用神</span><span class="bk-v bk-use">'+useg+'</span>'+
        (zod?'<span class="bk-k">'+zod+'</span>':'')+'</div>'+
        '<div class="bk-tip">名中可暗补命局所喜之五行（'+useg+'），补益越贴合综合分越高。</div></div>';
    } else {
      inner = '<div class="bubble"><p>八字尚在推算…</p></div>';
    }
  } else if(a.widget==="teacher"){
    inner = '<div class="teacherGrid">'+TEACHER_PICK.map(t=>'<button class="tcard" data-v="'+t.v+'"><span class="tn">'+t.name+'</span><span class="td">'+t.dim+'</span></button>').join("")+'</div>';
  } else {
    inner = '<div class="fields-row">'+fields.map(f=>'<div class="field"><label>'+f.label+'</label><input data-f="'+f.field+'" placeholder="'+f.ph+'" value="'+((state[f.field]||"").toString().replace(/"/g,'&quot;'))+'" maxlength="4" style="text-align:center" /></div>').join('')+'</div>';
  }
  transitionTo('<div class="bLayer"><div class="bubble"><span class="who">'+CHAR[sc.actor].name+'</span><p class="tw-line"></p></div></div>'+
    '<div class="cLayer">'+inner+(extraBtn?extraBtn:'')+'<button class="btn" disabled>继 续</button></div>', ()=>{
    const p = sceneEl.querySelector(".tw-line");
    const btn = sceneEl.querySelector(".cLayer .btn:not(.skip)");
    const revealContent = ()=>{
      if(a.widget==="seg"){
        let chosen = a.def;
        if(chosen!==undefined){ state[a.field]=chosen; if(a.theme) setTheme(chosen); markSeg(); }
        sceneEl.querySelectorAll(".seg button").forEach(b=>{
          b.onclick = ()=>{ state[a.field]=b.dataset.v; if(a.theme) setTheme(b.dataset.v); markSeg(); if(btn.disabled) btn.disabled=false; };
        });
        function markSeg(){ sceneEl.querySelectorAll(".seg button").forEach(b=>b.classList.toggle("sel", b.dataset.v==String(state[a.field]))); }
        btn.onclick = ()=>proceed(sc);
        typeText(p, line, 35, ()=>{ if(chosen!==undefined) btn.disabled=false; });
      } else if(a.widget==="birth"){
        btn.disabled = true;   // 必须填了出生日期才可继续（时辰默认 12）
        const commitBirth = ()=>{
          const dv = sceneEl.querySelector('input[data-f="birthdate"]').value;
          const hv = parseInt(sceneEl.querySelector('select[data-f="birthhour"]').value,10) || 12;
          if(dv){
            const p = dv.split('-').map(Number);
            state.birth = {year:p[0], month:p[1], day:p[2], hour:hv};
            state._birthDate = dv; state._birthHour = hv;
            state.birthText = p[0]+'年'+p[1]+'月'+p[2]+'日 · '+hv+'时';
          } else {
            state.birth = null; state.birthText = ""; state._birthDate=""; state.bazi=null;
          }
        };
        const dateInput = sceneEl.querySelector('input[data-f="birthdate"]');
        dateInput.oninput = dateInput.onchange = ()=>{ btn.disabled = !dateInput.value; };
        btn.onclick = ()=>{ commitBirth(); fetchBazi().then(()=>{
          // 填了 → 八字弹窗；A 线跳过则直接进主理，B 线直接进汇总
          go(state.birth ? "s08b_result" : (state.branch==="B"?"s_summary":"s08c"));
        }); };
        const skip = sceneEl.querySelector(".cLayer .skip");
        if(skip) skip.onclick = ()=>{ state.birth=null; state.bazi=null; state.birthText=""; state._birthDate=""; state._birthHour=12; go(_returnTarget()); };
        typeText(p, line, 35);
      } else if(a.widget==="bazi"){
        btn.disabled = false;
        btn.onclick = ()=>{ go(_returnTarget()); };
        typeText(p, line, 35);
      } else {
        const ins = sceneEl.querySelectorAll("input[data-f]");
        ins.forEach(i=>i.oninput=()=>{ btn.disabled = !(a.require||[]).every(f=>{ const el=sceneEl.querySelector('input[data-f="'+f+'"]'); return el && el.value.trim(); }); });
        btn.onclick = ()=>{
          fields.forEach(f=>{ state[f.field]=sceneEl.querySelector('input[data-f="'+f.field+'"]').value.trim(); });
          if(a.require && !a.require.every(f=>state[f])) return;
          proceed(sc);
        };
        typeText(p, line, 35);
      }
    };
    if(state._actorReady) revealContent(); else state._onActor = revealContent;
  });
}

/* ---------- 汇总过目（可改） ---------- */
function fmtMode(){ return {F:"随父",M:"随母",B:"复姓双承"}[state.mode] || "（未选）"; }
function fmtLen(){ return {2:"两字",3:"三字",4:"四字"}[state.name_len] || "（未选）"; }
function fmtGender(){ return {M:"男孩",F:"女孩",U:"不限"}[state.gender] || "（未选）"; }
function fmtTeacher(){ const t=state.primaryTeacher; if(!t||t==="balance") return "星师综合（均衡）"; const m=TEACHER_PICK.find(x=>x.v===t); return m?m.name+" · "+m.dim:"（未选）"; }
function renderSummary(sc){
  showActor(sc.actor);
  $("#step").textContent = sc.step || "过目";
  const rows = state.branch==="B"
    ? [["观测名字","name", state.name||"", "b1"], ["命格气韵","gender", fmtGender(), "b2"],
       ["生辰八字","birth", state.birthText||"", "s08b"]]
    : [  ["父姓","father", state.father||"", "s04"], ["母姓","mother", state.mother||"", "s04"],
       ["名随何方","mode", fmtMode(), "s05"], ["姓名字数","name_len", fmtLen(), "s07"],
       ["命格气韵","gender", fmtGender(), "s08"],
       ["生辰八字","birth", state.birthText||"", "s08b"],
       ["主理侧重","primaryTeacher", fmtTeacher(), "s08c"]];
  let html = '<div class="bubble no-arrow"><span class="who">'+(sc.actor?CHAR[sc.actor].name:"")+'</span><p>请小星主过目所录，确认或改动。</p></div><div class="summary">';
  rows.forEach(r=>{
    const empty = !r[2] || r[2]==="（未选）";
    html += '<div class="sumrow"><span class="sk">'+r[0]+'</span><span class="sv'+(empty?' empty':'')+'">'+(empty?'(未填)':r[2])+'</span><button class="edit" data-go="'+r[3]+'">改</button></div>';
  });
  html += '</div><button class="btn">确认无误 · 起卦</button>';
  transitionTo(html, ()=>{
    sceneEl.querySelectorAll(".edit").forEach(b=> b.onclick = ()=>{ state.editReturn="s_summary"; go(b.dataset.go); });
    sceneEl.querySelector(".btn").onclick = ()=>proceed(sc);
  });
}

/* ---------- 占算 ---------- */
function buildWeights(){
  const DIM = TEACHER_DIM[state.primaryTeacher];
  if(!DIM) return null;                 // balance / 未选 → 用后端默认均衡权重
  const w = Object.assign({}, DEFAULT_WEIGHTS);
  w[DIM] = (DEFAULT_WEIGHTS[DIM]||0.1) * WEIGHT_BOOST;   // 主理老师对应维度权重放大
  return w;
}
function callAPI(){
  const w = buildWeights();
  if(state.branch==="B"){
    return fetch("/api/analyze",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({name:state.name||"", gender:state.gender||"U", birth:state.birth||null, weights:w})}).then(r=>r.json());
  }
  return fetch("/api/generate",{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({father:state.father||"", mother:state.mother||"", mode:state.mode||"F",
      name_len:state.name_len||3, gender:state.gender||"U", tags:[], avoid:"", free_text:"", birth:state.birth||null, weights:w})}).then(r=>r.json());
}

/* #2 需求：提问阶段出场过的老师（assistant/ziyuan/yuwen/zhanxing/xingshi）放到表演序列后段；
        提问阶段未出场的老师（bagua/wuxing/shuli/shengxiao/yijing/diangu）优先出场。*/
const QTEACHERS = new Set(["assistant","ziyuan","yuwen","zhanxing","xingshi","wuxing"]);
function enterRitual(){
  $("#actorWrap").style.display="none";   // 演出时隐藏全局立绘
  $("#ritualWrap").style.display="flex";  // 表演立绘改由滤镜外的 #ritualWrap 承载（保持满色，不受饱和度递进影响）
  $("#step").textContent="占算";
  apiPromise = callAPI();
  apiPromise.then(d=>{ state.result=d; }).catch(e=>{ state.result={meta:{error:"推算中断："+e.message}}; });
  const perfSingles = shuffle(RITUAL.filter(r=>r.keys.length===1 && r.keys[0]!=="xingshi").slice());
  // 排序：非提问老师（0）排在提问老师（1）之前；组内保持 shuffle 顺序
  perfSingles.sort((a,b)=> (QTEACHERS.has(a.keys[0])?1:0) - (QTEACHERS.has(b.keys[0])?1:0));
  const pairs = shuffle(DUOS.slice());            // 双人合参走 DUOS 交叉互动台词
  const SEQ = perfSingles.slice(0,-1).concat(pairs.slice(0,-1));  // 本轮：单人减1、双人减1
  let i=0;
  /* 旋转大圆（orbit）沉到 #ritual 底部，不再与立绘/文字重叠；立绘在上、文字用对话泡在下。 */
  sceneEl.innerHTML = '<div id="ritual">'+
    '<div class="orbit"></div>'+
    '<div class="ritualStage"></div>'+
    '<div class="bubble ritualBubble"><span class="who"></span><p></p></div></div>';
  const stage = $("#ritualWrap");   // 表演立绘渲染到 #stage 之外的滤镜层（满色）
  const bubble = sceneEl.querySelector(".ritualBubble");
  const bubbleWho = bubble.querySelector(".who");
  const bubbleP = bubble.querySelector("p");
  const lineLen = (line)=> Array.isArray(line) ? line.join("").length : line.length;
  const dwell = (line)=> Math.min(3740, Math.round((1700 + lineLen(line)*22) * 1.1));  // 每位停留 +10%
  const STAR_DWELL = 2800;   // 星师总结停留（亦 +10%）
  state._revealed = false;
  function setActors(keys, onEntered){
    const list=(Array.isArray(keys)?keys:[keys]).filter(Boolean);
    stage.querySelectorAll(".ritualActor").forEach(a=>{ a.classList.remove("show"); a.classList.add("leave"); });   // 退场：镜像淡出(ritualLeave)动画
    setTimeout(()=>{
      if(!list.length){ stage.innerHTML=""; if(onEntered) onEntered(); return; }
      stage.innerHTML = list.map(k=>'<img class="ritualActor'+(list.length>1?' pair':'')+'" src="'+CHAR[k].file+'" alt="'+(CHAR[k].name||"")+'">').join("");
      requestAnimationFrame(()=>{ stage.querySelectorAll(".ritualActor").forEach(a=>a.classList.add("show"));
        setTimeout(()=>{ if(onEntered) onEntered(); }, 80); });   // 立绘一开始入场，文字即随之同频出现（不再等完全入场）；120→80ms 提前
    }, EXIT_MS);
  }
  function revealLine(who, html){
    if(state._revealed) return;
    bubble.classList.add("fade");
    setTimeout(()=>{ bubbleWho.textContent=who; bubbleP.innerHTML=html; bubble.classList.remove("fade"); }, 200);
  }
  function reveal(){   // 星师总结后先播放光球汇聚动效，再原地显示「揭晓」按钮（取代原跳过演出位置）
    if(state._revealed) return;
    state._revealed = true; clearTimeout(state._rt);
    playOrbFx(()=>{
      const rb = document.createElement("button");
      rb.className="btn"; rb.style.maxWidth="160px"; rb.style.margin="8px auto 0"; rb.textContent="揭 晓";
      rb.onclick = ()=>{ clearTimeout(state._rt); doReveal(rb); };
      sceneEl.querySelector("#ritual").appendChild(rb);
    });
  }
  /* 光球从屏幕外螺旋旋入中心 → 炸开 + 白屏 → 回调显示揭晓按钮 */
  function playOrbFx(done){
    const fx = document.getElementById("orbFx");
    if(!fx){ done(); return; }
    fx.innerHTML = "";
    const N = 7;
    for(let k=0;k<N;k++){
      const o = document.createElement("div"); o.className="orb";
      o.style.setProperty("--ang", (k*(360/N))+"deg");
      o.style.animationDelay = (k*0.05)+"s";
      fx.appendChild(o);
    }
    fx.classList.add("go");
    const spiral = 1350 + (N-1)*50 + 120;   // 螺旋到中心总时长（含末枚延迟）
    setTimeout(()=>{                         // 炸开：光球扩散 + 全白屏
      fx.querySelectorAll(".orb").forEach(o=>o.classList.add("boom"));
      const flash = $("#flash"); flash.classList.add("on","white");
    }, spiral);
    setTimeout(()=>{                         // 白屏退去，移除光球层，回调出按钮
      const flash = $("#flash"); flash.classList.remove("on","white");
      fx.classList.remove("go"); fx.innerHTML="";
      done();
    }, spiral + 520);
  }
  function step(){
    if(state._revealed) return;
    if(i<SEQ.length){
      const r=SEQ[i];
      const keys=r.keys;
      const who = keys.length>1 ? (CHAR[keys[0]].name+" · "+CHAR[keys[1]].name) : CHAR[keys[0]].name;
      const line = rnd(r.lines);                       // 每位老师随机交替一句
      setActors(keys, ()=> revealLine(who, Array.isArray(line)?line.join("<br>"):line));
      i++; state._rt=setTimeout(step, dwell(line));   // 按台词长度动态留时（已 +10%）
    } else {
      setActors("xingshi", ()=>{
        if(state._revealed) return;
        revealLine(CHAR.xingshi.name, rnd(STAR_LINES));
        state._rt=setTimeout(reveal, STAR_DWELL);
      });
    }
  }
  step();
}

/* ---------- 揭晓 + 结果 ---------- */
function doReveal(btn){
  if(state._revealing) return; state._revealing = true;   // 防重复触发（按钮可被连点）
  const flash = $("#flash");
  const finish = ()=>{
    flash.classList.add("on");
    setTimeout(()=>flash.classList.remove("on"), 280);
    setTimeout(()=>{ renderResult(); }, 520);
  };
  if(btn){ playRevealOrbFx(btn, finish); } else { finish(); }
}
/* 揭晓按钮按下：光球从按钮中心飞出 → 围成圆环旋转约1秒 → 炸开；随后白屏进入结果 */
function playRevealOrbFx(btn, done){
  const fx = document.getElementById("revealOrbFx");
  if(!fx || !btn){ if(done) done(); return; }
  const r = btn.getBoundingClientRect();
  const cx = r.left + r.width/2, cy = r.top + r.height/2;
  fx.innerHTML = "";
  const N = 9, R = 120;
  for(let k=0;k<N;k++){
    const o = document.createElement("div"); o.className="orb";
    o.style.left = cx+"px"; o.style.top = cy+"px";
    o.style.setProperty("--ang", (k*(360/N))+"deg");
    o.style.setProperty("--R", R+"px");
    fx.appendChild(o);
  }
  fx.classList.add("go");
  setTimeout(()=>{ fx.querySelectorAll(".orb").forEach(o=>o.classList.add("boom")); }, 1300);   // 飞出(0.39s)+旋转(≈0.91s)后炸开
  setTimeout(()=>{ fx.classList.remove("go"); fx.innerHTML=""; if(done) done(); }, 1300+500);
}

/* 导出某名字为图片：纯 canvas 手绘（离线可用、无外部依赖），始终导出「展开态」完整信息（名/综合分/六维/推荐理由/字义详解/命盘），不受当前卡片是否展开影响 */
function roundRect(ctx,x,y,w,h,r){ if(w<2*r)r=w/2; if(h<2*r)r=h/2;
  ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function wrapCN(ctx, text, x, y, maxW, lineH){
  let line="", yy=y;
  for(const ch of text){
    const test = line + ch;
    if(line && ctx.measureText(test).width > maxW){ ctx.fillText(line, x, yy); line=ch; yy+=lineH; }
    else line = test;
  }
  if(line) ctx.fillText(line, x, yy);
  return yy + lineH;
}
function exportNameImage(idx){
  const data = state.result || {names:[]};
  const n = (data.names||[])[idx];
  if(!n) return;
  const meta = data.meta || {};
  const W = 720, pad = 40, lineH = 22;
  const cv = document.createElement("canvas");
  const ctx = cv.getContext("2d");
  ctx.font = "13px 'PingFang SC','Microsoft YaHei',sans-serif";
  let contentH = 70 + (n.rank_reason ? 2*lineH+6 : 0) + 96 + (meta.has_birth ? 5*lineH+10 : 0) + 40;
  (n.explain||[]).forEach(e=>{ const t=(e.label?("· "+e.label+"："):"")+e.text; const lines=Math.max(1, Math.ceil(ctx.measureText(t).width / (W-2*pad-12))); contentH += lines*lineH+10; });
  if(n.starReview){ const sl=Math.max(1, Math.ceil(ctx.measureText(n.starReview).width / (W-2*pad))); contentH += 2*lineH + sl*lineH + 8; }
  const H = contentH + 2*pad;
  cv.width = W; cv.height = H;
  const bg = ctx.createLinearGradient(0,0,0,H); bg.addColorStop(0,"#4a3320"); bg.addColorStop(1,"#2c1d12");
  ctx.fillStyle = bg; roundRect(ctx,0,0,W,H,18); ctx.fill();
  ctx.strokeStyle="rgba(255,220,170,.3)"; ctx.lineWidth=1; roundRect(ctx,6,6,W-12,H-12,14); ctx.stroke();
  ctx.textBaseline="top"; let y = pad;
  ctx.fillStyle="#ffdca6"; ctx.font="600 13px 'PingFang SC','Microsoft YaHei',sans-serif";
  ctx.fillText("星命观测局 · 荐名", pad, y); y += 30;
  ctx.fillStyle="#ffffff"; ctx.font="700 38px 'PingFang SC','Microsoft YaHei',sans-serif";
  ctx.shadowColor="rgba(255,200,150,.5)"; ctx.shadowBlur=12; ctx.fillText(n.name, pad, y); ctx.shadowBlur=0;
  const scoreText = "综合 "+n.total; ctx.font="600 16px 'PingFang SC','Microsoft YaHei',sans-serif"; ctx.fillStyle="#ffe2b0";
  ctx.fillText(scoreText, W-pad-ctx.measureText(scoreText).width, y+12); y += 56;
  if(n.rank_reason){ ctx.fillStyle="#f0d9bb"; ctx.font="13px 'PingFang SC','Microsoft YaHei',sans-serif"; y = wrapCN(ctx, "★ 推荐理由："+n.rank_reason, pad, y, W-2*pad, lineH); y += 6; }
  ctx.font="11px 'PingFang SC','Microsoft YaHei',sans-serif";
  const colW = (W-2*pad - 2*16)/3;
  DIMS.forEach(([k,cn],i)=>{
    const cx = pad + (i%3)*(colW+16), cy = y + Math.floor(i/3)*(lineH+14);
    const v = n.dims ? n.dims[k] : null;
    ctx.fillStyle="#e9cfa8"; ctx.fillText(cn+" "+(v==null?"—":v), cx, cy);
    const bx=cx, by=cy+lineH-2, bw=colW, bh=6;
    ctx.fillStyle="rgba(0,0,0,.35)"; roundRect(ctx,bx,by,bw,bh,3); ctx.fill();
    const wpct=(v==null)?0:v, grad=ctx.createLinearGradient(bx,0,bx+bw,0); grad.addColorStop(0,"#ffd9a0"); grad.addColorStop(1,"#ffb259");
    ctx.fillStyle=grad; if(wpct>0){ roundRect(ctx,bx,by,bw*wpct/100,bh,3); ctx.fill(); }
  });
  y += 2*(lineH+14) + 16;
  if(meta.has_birth){
    ctx.fillStyle="#ffdca6"; ctx.font="600 13px 'PingFang SC','Microsoft YaHei',sans-serif"; ctx.fillText("命盘参详", pad, y); y += lineH;
    ctx.font="13px 'PingFang SC','Microsoft YaHei',sans-serif"; ctx.fillStyle="#f5e7d2";
    const gz=(meta.gz||[]).join(" "), dm=meta.day_master?(meta.day_master+(meta.day_master_wx||"")):"—";
    const strong={"旺":"身旺","弱":"身弱","中和":"中和"}[meta.strong]||"—", useg=(meta.use_gods||[]).join("、")||"—";
    const zod=meta.zodiac?("生肖 "+meta.zodiac):"";
    y = wrapCN(ctx, "八字 "+gz+"　日主 "+dm+"　旺衰 "+strong+"　喜用神 "+useg+(zod?("　"+zod):""), pad, y, W-2*pad, lineH); y += 8;
  }
  ctx.fillStyle="#ffdca6"; ctx.font="600 13px 'PingFang SC','Microsoft YaHei',sans-serif"; ctx.fillText("字义详解", pad, y); y += lineH;
  ctx.font="13px 'PingFang SC','Microsoft YaHei',sans-serif"; ctx.fillStyle="#efe0c8";
  (n.explain||[]).forEach(e=>{ y = wrapCN(ctx, (e.label?("· "+e.label+"："):"")+e.text, pad+12, y, W-2*pad-12, lineH); y += 8; });
  if(n.starReview){
    ctx.fillStyle="#ffdca6"; ctx.font="600 13px 'PingFang SC','Microsoft YaHei',sans-serif"; ctx.fillText("星师详解", pad, y); y += lineH;
    ctx.font="13px 'PingFang SC','Microsoft YaHei',sans-serif"; ctx.fillStyle="#efe0c8";
    y = wrapCN(ctx, n.starReview, pad+12, y, W-2*pad-12, lineH); y += 8;
  }
  ctx.fillStyle="rgba(255,220,170,.6)"; ctx.font="11px 'PingFang SC','Microsoft YaHei',sans-serif"; ctx.fillText("星命观测局 · 起名推演", pad, H-pad-14);
  cv.toBlob(b=>{ if(!b) return; const a=document.createElement("a"); a.download="星名_"+n.name+".png"; a.href=URL.createObjectURL(b); a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),1000); }, "image/png");
}

/* 落叶：贯穿全程（首页与各步骤同屏飘落）。首页用多彩色板，内部步骤跟随主体色/饱和度 */
let wind = 24;
setInterval(()=>{ wind = Math.max(-100, Math.min(100, wind + (Math.random()*70-35))); }, 4500);
/* 首页多彩色板：绿/金/橙/红/青/紫，丰富变化 */
const LEAF_HOME_THEMES = [
  {a:"#7bc47f", b:"#3f8a4f", g:"rgba(120,200,130,.30)"},
  {a:"#f2c14e", b:"#d99a2b", g:"rgba(240,200,80,.32)"},
  {a:"#e8843c", b:"#c75a1e", g:"rgba(230,140,60,.30)"},
  {a:"#d9596b", b:"#b03a4f", g:"rgba(220,90,110,.30)"},
  {a:"#6fb6c4", b:"#3f8a9a", g:"rgba(110,190,210,.30)"},
  {a:"#a98fd0", b:"#7a5fb0", g:"rgba(170,140,210,.30)"}
];
/* 内部步骤：跟随最终页主题色（与 setTheme 对应）：M 男孩·蓝 / F 女孩·粉 / U 不限·紫 */
const LEAF_THEMES = [
  {a:"#6f86c4", b:"#3f4d86", g:"rgba(110,140,220,.26)"},
  {a:"#d4749a", b:"#a85379", g:"rgba(220,130,175,.28)"},
  {a:"#8a6fb0", b:"#6a4f97", g:"rgba(150,110,210,.22)"}
];
function spawnLeaf(){
  const wrap = $("#leaves"); if(!wrap) return;
  /* 落叶贯穿全程（首页与各步骤同屏飘落），颜色/饱和度跟随主题(--accent/--sat) */
  const el = document.createElement("div");
  el.className = "leaf";
  el.style.left = (Math.random()*100).toFixed(1)+"%";
  el.style.setProperty("--drift", (wind + gustBoost + (Math.random()*40-20)).toFixed(0)+"px");
  const dur = (7+Math.random()*6).toFixed(1);
  el.style.animationDuration = dur+"s";
  el.style.width = (9+Math.random()*6).toFixed(0)+"px";
  el.style.height = (11+Math.random()*6).toFixed(0)+"px";
  const ang = 120 + Math.floor(Math.random()*120);
  if(state.scene === "brand"){            /* 首页：多彩色板，满饱和 */
    const t = LEAF_HOME_THEMES[Math.floor(Math.random()*LEAF_HOME_THEMES.length)];
    el.style.background = "linear-gradient("+ang+"deg,"+t.a+","+t.b+")";
    el.style.filter = "drop-shadow(0 0 4px "+t.g+") drop-shadow(0 1px 1px rgba(60,40,90,.2))";
  } else {                                 /* 内部步骤：跟随主体色与饱和度 */
    const order = Math.random()<0.5 ? "var(--accent),var(--accent2)" : "var(--accent2),var(--accent)";
    el.style.background = "linear-gradient("+ang+"deg,"+order+")";
    el.style.filter = "saturate(var(--sat)) drop-shadow(0 0 4px var(--glow)) drop-shadow(0 1px 1px rgba(60,40,90,.2))";
  }
  wrap.appendChild(el);
  setTimeout(()=>el.remove(), dur*1000+300);
}
const LEAF_INTERVAL = Math.round(2200 / 1.5);   /* 落叶频率增加 50%（2200ms → 约1467ms） */
setInterval(spawnLeaf, LEAF_INTERVAL);

/* 阵风：rAF 驱动的钟形曲线(sin)，单次持续 ~6s 平滑渐强→渐弱；阵风间歇 ~4.5–7.5s */
let gustBoost = 0;
let gustDir = Math.random()<0.5 ? -1 : 1;
let gustStart = 0;
const GUST_PEAK = 60;     // 峰值偏移(px) — 整体强度略增，曲线(渐强渐弱)保持不变
const GUST_LEN  = 6000;   // 单次阵风总时长(ms)
const GUST_PAUSE_MIN = 4500, GUST_PAUSE_RAND = 3000;
function gustTick(ts){
  if(!gustStart) gustStart = ts;
  const dt = ts - gustStart;
  if(dt >= 0 && dt < GUST_LEN){
    const t = dt / GUST_LEN;
    const k = (t < 0.5) ? Math.pow(t/0.5, 2.2) : Math.sin((1 - t) * Math.PI);  // 渐强陡峭(起步猛)、渐弱保持平缓钟形
    const off = gustDir * GUST_PEAK * k;
    const lw = $("#leaves");
    if(lw) lw.style.transform = "translateX("+off.toFixed(1)+"px)";
    gustBoost = off;                                   // 同步影响新叶横向漂移
    requestAnimationFrame(gustTick);
  } else if(dt >= GUST_LEN){
    const lw = $("#leaves");
    if(lw) lw.style.transform = "translateX(0)";
    gustBoost = 0;
    gustDir = Math.random()<0.5 ? -1 : 1;              // 下一阵风随机方向
    gustStart = ts + (GUST_PAUSE_MIN + Math.random()*GUST_PAUSE_RAND);
    requestAnimationFrame(gustTick);
  }
}
requestAnimationFrame(gustTick);

/* 全局环境氛围层：闪烁星点 / 随机运动圆环 / 若隐若现光晕 / 不断变化的星座线 */
function buildAmbient(){
  const a = $("#ambient"); if(!a) return;
  for(let i=0;i<28;i++){                              // 低透明度闪烁星点
    const s=document.createElement("div"); s.className="astar";
    s.style.left=(Math.random()*100).toFixed(2)+"%"; s.style.top=(Math.random()*100).toFixed(2)+"%";
    const sz=(1+Math.random()*1.7).toFixed(1); s.style.width=sz+"px"; s.style.height=sz+"px";
    s.style.setProperty("--tw",(3+Math.random()*4).toFixed(1)+"s");
    s.style.setProperty("--op",(0.22+Math.random()*0.4).toFixed(2));
    s.style.animationDelay=(-Math.random()*6).toFixed(1)+"s";
    a.appendChild(s);
  }
  for(let i=0;i<4;i++){                               // 随机运动圆环
    const r=document.createElement("div"); r.className="aring";
    r.style.left=(8+Math.random()*72).toFixed(1)+"%"; r.style.top=(12+Math.random()*62).toFixed(1)+"%";
    const d=(60+Math.random()*90).toFixed(0); r.style.width=d+"px"; r.style.height=d+"px";
    r.style.setProperty("--rm",(16+Math.random()*14).toFixed(0)+"s");
    r.style.setProperty("--dx",(Math.random()*70-35).toFixed(0)+"px");
    r.style.setProperty("--dy",(Math.random()*70-35).toFixed(0)+"px");
    r.style.animationDelay=(-Math.random()*12).toFixed(1)+"s";
    a.appendChild(r);
  }
  for(let i=0;i<3;i++){                               // 若隐若现光晕
    const g=document.createElement("div"); g.className="aglow";
    g.style.left=(6+Math.random()*70).toFixed(1)+"%"; g.style.top=(10+Math.random()*60).toFixed(1)+"%";
    const d=(150+Math.random()*170).toFixed(0); g.style.width=d+"px"; g.style.height=d+"px";
    g.style.setProperty("--gp",(8+Math.random()*6).toFixed(0)+"s");
    g.style.setProperty("--op",(0.1+Math.random()*0.12).toFixed(2));
    g.style.animationDelay=(-Math.random()*7).toFixed(1)+"s";
    a.appendChild(g);
  }
  buildConstellation(a);
}
function buildConstellation(a){
  const NS="http://www.w3.org/2000/svg";
  const svg=document.createElementNS(NS,"svg");
  svg.setAttribute("class","aconst"); svg.style.position="absolute"; svg.style.inset="0";
  svg.style.width="100%"; svg.style.height="100%"; svg.style.opacity="1"; svg.style.transition="opacity .9s";
  a.appendChild(svg);
  const dist=(p,q)=>Math.hypot(p[0]-q[0], p[1]-q[1]);
  function regen(){
    const n=7; const pts=[];
    for(let i=0;i<n;i++) pts.push([Math.random()*100, Math.random()*100, (Math.random()*2.2+1.2).toFixed(1)]);
    let html="";
    for(let i=0;i<n;i++){
      const others=[...Array(n).keys()].filter(j=>j!==i).sort((x,y)=>dist(pts[i],pts[x])-dist(pts[i],pts[y])).slice(0,2);
      others.forEach(j=>{ if(i<j) html+='<line x1="'+pts[i][0]+'%" y1="'+pts[i][1]+'%" x2="'+pts[j][0]+'%" y2="'+pts[j][1]+'%" stroke="var(--accent)" stroke-opacity="0.13" stroke-width="1"/>'; });
      html+='<circle cx="'+pts[i][0]+'%" cy="'+pts[i][1]+'%" r="'+pts[i][2]+'" fill="var(--accent)" fill-opacity="0.22"/>';
    }
    svg.innerHTML=html;
  }
  regen();
  setInterval(()=>{ svg.style.opacity="0"; setTimeout(()=>{ regen(); svg.style.opacity="1"; }, 900); }, 7200);
}
buildAmbient();

/* 启动 */
go("brand");
</script>
</body>
</html>
