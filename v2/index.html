<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>星命观测局 · 2.0</title>
<style>
  :root{
    --bg:#f5f3fa; --bg2:#e6def2;
    --ink:#2b2735; --ink-soft:#6b6380;
    --panel:rgba(255,255,255,.80); --panel-line:rgba(60,40,90,.12);
    --accent:#8a6fb0; --accent2:#6a4f97; --glow:rgba(150,110,210,.22);
    --aura:rgba(255,255,255,.95); --aura-soft:rgba(244,240,252,.60);
    --radius:18px;
    --ease:cubic-bezier(.22,.61,.36,1);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0}
  body{
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
    color:var(--ink); background:radial-gradient(120% 80% at 50% -10%,var(--bg2),var(--bg) 60%);
    overflow:hidden;
  }
  /* 星尘背景 */
  #stars{position:fixed;inset:0;pointer-events:none;z-index:0;
    background:
      radial-gradient(2px 2px at 20% 30%,rgba(123,92,170,.40),transparent),
      radial-gradient(1.5px 1.5px at 70% 20%,rgba(123,92,170,.30),transparent),
      radial-gradient(1.5px 1.5px at 40% 70%,rgba(123,92,170,.28),transparent),
      radial-gradient(2px 2px at 85% 60%,rgba(123,92,170,.34),transparent),
      radial-gradient(1px 1px at 55% 45%,rgba(123,92,170,.28),transparent);
    animation:drift 18s linear infinite alternate;}
  @keyframes drift{to{transform:translateY(-12px)}}

  #leaves{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
  .leaf{position:absolute;top:-24px;width:12px;height:14px;
    background:linear-gradient(160deg,#cdbbe8,#9a86c4);
    border-radius:0 80% 0 80%/0 80% 0 80%;
    animation:fall linear forwards;filter:drop-shadow(0 0 4px rgba(150,120,200,.4))}
  @keyframes fall{
    0%{transform:translateY(-24px) translateX(0) rotate(0deg);opacity:0}
    8%{opacity:.85}
    88%{opacity:.8}
    100%{transform:translateY(106vh) translateX(var(--drift,30px)) rotate(420deg);opacity:0}
  }

  #app{position:relative;z-index:1;height:100%;display:flex;flex-direction:column;
    max-width:520px;margin:0 auto;padding:env(safe-area-inset-top) 18px env(safe-area-inset-bottom);}

  /* 立绘层 */
  #actorWrap{position:absolute;left:0;right:0;bottom:32%;display:flex;justify-content:center;align-items:flex-end;gap:6px;padding:0 8px;
    pointer-events:none;z-index:1;}
  .actor{height:54vh;max-height:440px;width:auto;object-fit:contain;
    filter:blur(10px) drop-shadow(0 0 18px var(--aura)) drop-shadow(0 0 42px var(--aura-soft)) drop-shadow(0 8px 14px rgba(70,50,100,.16));
    opacity:0;transform:translateY(18px) scale(.98);
    transition:opacity .38s var(--ease),transform .42s var(--ease),filter .42s var(--ease);}
  .actor.show{opacity:1;transform:none;
    filter:drop-shadow(0 0 18px var(--aura)) drop-shadow(0 0 42px var(--aura-soft)) drop-shadow(0 8px 14px rgba(70,50,100,.16));}
  .actor.pair{height:40vh;max-height:320px}

  /* 顶部品牌条 */
  #top{display:flex;align-items:center;gap:8px;padding:14px 4px 6px;z-index:3;color:var(--ink-soft);font-size:13px;letter-spacing:.18em}
  #top b{color:var(--accent);font-weight:600;letter-spacing:.22em}
  #step{margin-left:auto;font-size:12px;opacity:.7;letter-spacing:.05em}

  /* 场景舞台 */
  #stage{flex:1;display:flex;flex-direction:column;justify-content:flex-end;z-index:2;
    padding-bottom:8px;min-height:0;}
  #scene{transition:opacity .32s var(--ease),transform .32s var(--ease);}
  #scene.out{opacity:0;transform:translateX(-26px)}
  #scene.in{opacity:0;transform:translateX(26px)}

  /* 对话气泡（漫画风） */
  .bubble{background:var(--panel);border:1.5px solid var(--panel-line);border-radius:var(--radius);
    padding:16px 18px 18px;backdrop-filter:blur(8px);box-shadow:0 10px 30px rgba(70,50,100,.20);
    font-size:16px;line-height:1.6;color:var(--ink);position:relative;}
  .bubble::before{content:"";position:absolute;left:30px;bottom:-13px;width:0;height:0;
    border:13px solid transparent;border-top-color:var(--panel-line);border-bottom:0}
  .bubble::after{content:"";position:absolute;left:33px;bottom:-9px;width:0;height:0;
    border:10px solid transparent;border-top-color:var(--panel);border-bottom:0}
  .bubble .who{display:block;font-size:12px;letter-spacing:.16em;color:var(--accent);margin-bottom:8px;font-weight:600}
  .bubble p{margin:0}

  /* 输入控件 */
  .ask{margin-top:14px;display:flex;flex-direction:column;gap:10px}
  .field label{display:block;font-size:12px;color:var(--ink-soft);margin-bottom:5px;letter-spacing:.05em}
  .field input{width:100%;background:rgba(255,255,255,.65);border:1px solid var(--panel-line);
    border-radius:12px;padding:12px 14px;color:var(--ink);font-size:16px;outline:none;transition:border-color .2s}
  .field input:focus{border-color:var(--accent)}
  .seg{display:flex;gap:8px;flex-wrap:wrap}
  .seg button{flex:1;min-width:84px;background:rgba(255,255,255,.60);border:1px solid var(--panel-line);
    color:var(--ink-soft);border-radius:12px;padding:12px 8px;font-size:15px;cursor:pointer;
    transition:all .2s var(--ease)}
  .seg button.sel{background:linear-gradient(160deg,var(--accent),var(--accent2));
    color:#fff;border-color:transparent;box-shadow:0 6px 18px var(--glow)}
  .hint{font-size:12px;color:var(--ink-soft);opacity:.8;margin-top:2px}

  .btn{margin-top:16px;width:100%;border:none;border-radius:14px;padding:14px;font-size:16px;
    font-weight:600;color:#fff;cursor:pointer;background:linear-gradient(160deg,var(--accent),var(--accent2));
    box-shadow:0 8px 22px var(--glow);transition:transform .15s,opacity .2s,filter .2s;letter-spacing:.05em}
  .btn:active{transform:scale(.98)}
  .btn:disabled{opacity:.4;filter:grayscale(.4);cursor:not-allowed;box-shadow:none}
  .btn.ghost{background:rgba(255,255,255,.55);border:1px solid var(--panel-line);box-shadow:0 4px 14px rgba(70,50,100,.10);color:var(--ink-soft)}

  /* 汇总过目表 */
  .summary{background:var(--panel);border:1px solid var(--panel-line);border-radius:var(--radius);
    padding:4px;backdrop-filter:blur(8px);box-shadow:0 10px 30px rgba(70,50,100,.18);overflow:hidden;margin-top:14px}
  .sumrow{display:flex;align-items:center;gap:10px;padding:11px 12px;border-bottom:1px solid var(--panel-line)}
  .sumrow:last-child{border-bottom:none}
  .sumrow .sk{font-size:12px;color:var(--ink-soft);letter-spacing:.08em;width:64px;flex:none}
  .sumrow .sv{flex:1;font-size:15px;color:var(--ink);word-break:break-all}
  .sumrow .sv.empty{color:var(--ink-soft);opacity:.6}
  .sumrow .edit{flex:none;border:none;background:linear-gradient(160deg,var(--accent),var(--accent2));
    color:#fff;border-radius:10px;padding:7px 14px;font-size:13px;cursor:pointer;transition:transform .15s}
  .sumrow .edit:active{transform:scale(.94)}

  /* 品牌开场 */
  #brand{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:0 18px}
  #brand .logo{font-size:30px;letter-spacing:.4em;color:var(--accent);font-weight:700;
    text-shadow:0 0 24px var(--glow);animation:logoIn 1.1s var(--ease) both}
  #brand .sub{margin-top:14px;color:var(--ink-soft);font-size:14px;letter-spacing:.2em;opacity:0;animation:fadeUp .9s .5s var(--ease) both}
  @keyframes logoIn{from{opacity:0;letter-spacing:.9em;filter:blur(6px)}to{opacity:1}}
  @keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:.9;transform:none}}

  /* 占算 */
  #ritual{margin:auto 0;text-align:center}
  #ritual .line{font-size:17px;line-height:1.7;color:var(--ink);min-height:3.4em;
    transition:opacity .4s var(--ease)}
  #ritual .line.fade{opacity:0}
  .orbit{width:120px;height:120px;margin:0 auto 22px;border-radius:50%;
    border:1px solid var(--panel-line);position:relative;
    background:conic-gradient(from 0deg,transparent,var(--glow),transparent);
    animation:spin 6s linear infinite;box-shadow:0 0 40px var(--glow)}
  .orbit::after{content:"";position:absolute;inset:34px;border-radius:50%;
    background:radial-gradient(circle,var(--accent),transparent 70%);opacity:.7}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* 静待揭晓 */
  #wait{margin:auto 0;text-align:center}
  #wait .crow{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;margin:18px 0 10px}
  #wait .crow img{width:38px;height:54px;object-fit:cover;object-position:top;border-radius:8px;
    opacity:.9;border:1px solid var(--panel-line);filter:drop-shadow(0 0 7px var(--aura-soft)) drop-shadow(0 4px 8px rgba(70,50,100,.18))}
  #wait .tip{color:var(--ink-soft);font-size:14px;letter-spacing:.1em;margin-top:6px}
  .spinner{width:30px;height:30px;border:3px solid var(--panel-line);border-top-color:var(--accent);
    border-radius:50%;margin:20px auto;animation:spin 1s linear infinite}

  /* 揭晓光效 */
  #flash{position:fixed;inset:0;z-index:9;pointer-events:none;opacity:0;
    background:radial-gradient(circle at 50% 60%,rgba(255,247,220,.9),transparent 55%);
    transition:opacity .25s ease}
  #flash.on{opacity:1}

  /* 结果木牌 */
  #result{position:absolute;top:0;bottom:0;left:0;right:0;z-index:5;overflow-y:auto;
    max-width:440px;margin:0 auto;padding:8px 12px 20px;
    background:linear-gradient(180deg,rgba(245,243,250,.6),rgba(238,234,248,.95));
    opacity:0;transform:translateY(20px);transition:opacity .5s var(--ease),transform .5s var(--ease);
    pointer-events:none;}
  #result.show{opacity:1;transform:none;pointer-events:auto}
  #result h2{font-size:15px;letter-spacing:.2em;color:var(--accent);text-align:center;margin:6px 0 14px;font-weight:600}
  .plate{background:linear-gradient(160deg,#6b4a2f,#4f3621);border:1px solid rgba(255,220,170,.25);
    border-radius:14px;padding:14px 16px;margin-bottom:14px;box-shadow:0 10px 24px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,230,190,.18);
    color:#f5e7d2;transform:translateY(14px);opacity:0;transition:opacity .5s var(--ease),transform .5s var(--ease)}
  .plate.in{opacity:1;transform:none}
  .plate .pname{font-size:26px;font-weight:700;letter-spacing:.08em;color:#fff}
  .plate .pscore{float:right;font-size:14px;color:#ffe2b0;margin-top:6px}
  .plate .preason{font-size:13px;color:#f0d9bb;margin-top:8px;line-height:1.5;border-top:1px dashed rgba(255,220,170,.3);padding-top:8px}
  .dims{display:grid;grid-template-columns:repeat(3,1fr);gap:8px 12px;margin-top:12px}
  .dim .dl{font-size:11px;color:#e9cfa8;display:flex;justify-content:space-between;margin-bottom:3px}
  .dim .bar{height:6px;border-radius:4px;background:rgba(0,0,0,.3);overflow:hidden}
  .dim .bar i{display:block;height:100%;background:linear-gradient(90deg,#ffd9a0,#ffb259);border-radius:4px}
  .dim .bar i.na{background:repeating-linear-gradient(45deg,rgba(255,255,255,.12),rgba(255,255,255,.12) 4px,transparent 4px,transparent 8px)}
  .explain{margin-top:10px;font-size:13px;color:#efe0c8;line-height:1.6;display:none}
  .explain.show{display:block}
  .explain .ei{margin:5px 0;padding-left:12px;border-left:2px solid rgba(255,220,170,.35)}
  .explain .ei b{color:#ffdca6;font-weight:600;margin-right:6px}
  .toggle{margin-top:10px;font-size:12px;color:#ffdca6;cursor:pointer;background:none;border:none;padding:0;letter-spacing:.05em}
  #resultFoot{text-align:center;margin-top:6px}
  @media (prefers-reduced-motion:reduce){
    *{animation-duration:.001s!important;transition-duration:.12s!important}
  }
</style>
</head>
<body>
<div id="stars"></div>
<div id="leaves"></div>
<div id="app">
  <div id="top"><b>星命观测局</b><span id="step"></span></div>
  <div id="actorWrap"></div>
  <div id="stage"><div id="scene"></div></div>
</div>
<div id="flash"></div>
<div id="result"></div>

<script>
"use strict";
const CHAR = {
  assistant:{name:"观测小助理", file:"/characters/char-assistant-1.png"},
  ziyuan:{name:"字源老师", file:"/characters/char-ziyuan-1.png"},
  yuwen:{name:"语文老师", file:"/characters/char-yuwen-1.png"},
  zhanxing:{name:"占星老师", file:"/characters/char-zhanxing-1.png"},
  bagua:{name:"八卦老师", file:"/characters/char-bagua-1.png"},
  yijing:{name:"意境老师", file:"/characters/char-yijing-1.png"},
  xingshi:{name:"星师", file:"/characters/char-xingshi-1.png"},
  shengxiao:{name:"生肖老师", file:"/characters/char-shengxiao-1.png"},
  shuli:{name:"数理老师", file:"/characters/char-shuli-1.png"},
  wuxing:{name:"五行老师", file:"/characters/char-wuxing-1.png"},
  yinlv:{name:"音律老师", file:"/characters/char-yinlv-1.png"},
  xingtai:{name:"形义老师", file:"/characters/char-xingtai-1.png"},
};
const RITUAL = [
  {keys:["bagua"], line:"八卦老师起卦：先天既演，请诸位同参。"},
  {keys:["ziyuan","yuwen"], line:"字源、语文二位老师同观：形声已定，平仄相调，读来自成其韵。"},
  {keys:["ziyuan"], line:"字源老师：姓氏所承，血脉可溯，本义既明，骨架乃立。"},
  {keys:["yuwen"], line:"语文老师：音律朗朗，轻重得宜，呼之清、应之远。"},
  {keys:["zhanxing"], line:"占星老师：命盘映照，刚柔可度，阴阳各有归处。"},
  {keys:["wuxing","shuli"], line:"五行、数理二位老师合参：五行相生相济，五格数理各得其位。"},
  {keys:["shengxiao"], line:"生肖老师：生肖相宜，无冲无克，幼得护、长得益。"},
  {keys:["yinlv","xingtai"], line:"音律、形义二位老师同审：声形相生，观之悦目、闻之悦耳。"},
  {keys:["yijing"], line:"意境老师：气象氤氲，期许在望，字里行间已有远意。"},
  {keys:["xingshi"], line:"星师：诸师既毕，落笔在即，静候佳名降于小星主。"},
];
const DIMS = [["wuxing","五行"],["zodiac","生肖"],["pronounce","音律"],["meaning","字义"],["stroke","数理"],["gender","气韵"]];

const SCENES = {
  brand:{kind:"brand", next:"s01"},
  s01:{kind:"talk", actor:"assistant", step:"引路", lines:[
      "小星主将至，我是本局的观测助理，先替您引路。",
      "星命观测局恭候多时，待小星主降世，自有佳名相迎。"], next:"s02"},
  s02:{kind:"branch", actor:"assistant", step:"定分支", lines:[
      "您是想请星师荐名，还是观测已有的候选名？"],
      branch:[{label:"请星师荐名", next:"s03a", set:{branch:"A"}},
              {label:"观测已有候选名", next:"s03b", set:{branch:"B"}}]},
  s03a:{kind:"talk", actor:"assistant", step:"引荐", lines:[
      "说来惭愧，我修行尚浅，还是请专门的老师为您细看。",
      "取名乃大事，我这就引各位老师前来，请您安心。"] , next:"s04"},
  s03b:{kind:"talk", actor:"assistant", step:"引荐", lines:[
      "也好，请写下那名字，我请语文老师为您细细观测。"] , next:"b1"},
  s04:{kind:"ask", actor:"ziyuan", step:"第一观测层 · 血脉", lines:[
      "姓氏不仅是名字的开端，也影响整体音律、字形与节奏。"],
      ask:{widget:"two", fields:[{field:"father",label:"父姓",ph:"如 李伟"},{field:"mother",label:"母姓（可空）",ph:"如 王芳"}],
      require:["father"]}, next:"s05"},
  s05:{kind:"ask", actor:"ziyuan", step:"第一观测层 · 血脉", lines:[
      "小星主名随何方？"],
      ask:{widget:"seg", field:"mode", def:"F", options:[{v:"F",label:"随父"},{v:"M",label:"随母"},{v:"B",label:"复姓双承"}]}, next:"s06"},
  s06:{kind:"talk", actor:"ziyuan", step:"退场", lines:[
      "我先定下姓名的骨架，余下交由其他老师细看。",
      "姓氏已立，骨架既成，请语文老师斟酌字数。"] , next:"s07"},
  s07:{kind:"ask", actor:"yuwen", step:"第一观测层 · 字数", lines:[
      "姓氏方式会改变姓名的长度、重音与整体气质。"],
      ask:{widget:"seg", field:"name_len", def:3, options:[{v:2,label:"两字"},{v:3,label:"三字"},{v:4,label:"四字"}]}, next:"s08"},
  s08:{kind:"ask", actor:"zhanxing", step:"第二观测层 · 命格", lines:[
      "先观命盘阴阳，方好定笔意刚柔。"],
      ask:{widget:"seg", field:"gender", def:"U", theme:true,
      options:[{v:"M",label:"男孩"},{v:"F",label:"女孩"},{v:"U",label:"不限"}]}, next:"s_summary"},
  b1:{kind:"ask", actor:"yuwen", step:"观测 · 名字", lines:[
      "请写下要观测的名字。"],
      ask:{widget:"one", field:"name", ph:"如 林婉婷", require:["name"]}, next:"b2"},
  b2:{kind:"ask", actor:"zhanxing", step:"观测 · 命格", lines:[
      "小星主是男孩还是女孩？"],
      ask:{widget:"seg", field:"gender", def:"U", theme:true,
      options:[{v:"M",label:"男孩"},{v:"F",label:"女孩"},{v:"U",label:"不限"}]}, next:"s_summary"},
  s_summary:{kind:"summary", actor:"xingshi", step:"过目", next:"s09"},
  s09:{kind:"ritual"},
  s10:{kind:"wait"},
};

const state = {scene:null, branch:"A"};
let apiPromise = null;
const $ = (s)=>document.querySelector(s);
const sceneEl = $("#scene");

function setTheme(g){
  const root = document.documentElement.style;
  if(g==="M"){ root.setProperty("--accent","#6f86c4"); root.setProperty("--accent2","#3f4d86"); root.setProperty("--glow","rgba(110,140,220,.26)"); }
  else if(g==="F"){ root.setProperty("--accent","#d4749a"); root.setProperty("--accent2","#a85379"); root.setProperty("--glow","rgba(220,130,175,.28)"); }
  else { root.setProperty("--accent","#8a6fb0"); root.setProperty("--accent2","#6a4f97"); root.setProperty("--glow","rgba(150,110,210,.22)"); }
}
function showActors(keys){
  const wrap = $("#actorWrap");
  const list = (Array.isArray(keys)?keys:[keys]).filter(Boolean);
  const sig = list.join("|");
  if(wrap.dataset.sig===sig) return;
  wrap.dataset.sig = sig;
  wrap.querySelectorAll(".actor").forEach(a=>a.classList.remove("show"));
  setTimeout(()=>{
    if(!list.length){ wrap.innerHTML=""; return; }
    wrap.innerHTML = list.map(k=>'<img class="actor'+(list.length>1?' pair':'')+'" src="'+CHAR[k].file+'" alt="'+(CHAR[k].name||"")+'" data-key="'+k+'">').join("");
    requestAnimationFrame(()=>wrap.querySelectorAll(".actor").forEach(a=>a.classList.add("show")));
  }, 280);
}
function showActor(key){ showActors(key?[key]:[]); }
function rnd(a){ return a[Math.floor(Math.random()*a.length)]; }

function go(id){
  const sc = SCENES[id];
  state.scene = id;
  if(!sc) return;
  if(sc.kind==="ritual"){ enterRitual(); return; }
  if(id==="s10" && !state.result){
    renderWait(true);
    apiPromise.then(()=>renderWait(false)).catch(()=>renderWait(false));
    return;
  }
  renderScene(sc);
}

function transitionTo(html, after){
  sceneEl.classList.add("out");
  setTimeout(()=>{
    sceneEl.innerHTML = html;
    sceneEl.classList.remove("out"); sceneEl.classList.add("in");
    requestAnimationFrame(()=>{ sceneEl.classList.remove("in"); if(after) after(); });
  }, 300);
}

function renderScene(sc){
  if(sc.actor!==undefined) showActor(sc.actor);
  $("#step").textContent = sc.step || "";
  if(sc.kind==="brand") return renderBrand(sc);
  if(sc.kind==="talk") return renderTalk(sc);
  if(sc.kind==="branch") return renderBranch(sc);
  if(sc.kind==="ask") return renderAsk(sc);
  if(sc.kind==="summary") return renderSummary(sc);
  if(sc.kind==="wait") return renderWait(false);
}

function renderBrand(sc){
  sceneEl.innerHTML = '<div id="brand"><div class="logo">星命观测局</div><div class="sub">为小星主，参一名</div>'+
    '<button class="btn" style="margin-top:26px;max-width:200px;margin-left:auto;margin-right:auto">进 入</button></div>';
  sceneEl.querySelector(".btn").onclick = ()=>go(sc.next);
}

function renderTalk(sc){
  const line = rnd(sc.lines);
  transitionTo('<div class="bubble"><span class="who">'+(sc.actor?CHAR[sc.actor].name:"")+'</span><p>'+line+'</p></div>'+
    '<button class="btn">继 续</button>', ()=>{
    sceneEl.querySelector(".btn").onclick = ()=>go(sc.next);
  });
}

function renderBranch(sc){
  const line = rnd(sc.lines);
  let btns = sc.branch.map((b,i)=>'<button class="btn'+(i>0?' ghost':'')+'" data-i="'+i+'">'+b.label+'</button>').join("");
  transitionTo('<div class="bubble"><span class="who">'+CHAR[sc.actor].name+'</span><p>'+line+'</p></div><div class="ask">'+btns+'</div>', ()=>{
    sceneEl.querySelectorAll(".btn[data-i]").forEach(btn=>{
      btn.onclick = ()=>{ const b = sc.branch[+btn.dataset.i]; if(b.set) Object.assign(state,b.set); go(b.next); };
    });
  });
}

function renderAsk(sc){
  const a = sc.ask;
  const line = rnd(sc.lines);
  const fields = a.fields || (a.field ? [{field:a.field, label:a.label||"", ph:a.ph||""}] : []);
  let inner = "";
  if(a.widget==="seg"){
    inner = '<div class="seg">'+a.options.map(o=>'<button data-v="'+o.v+'">'+o.label+'</button>').join("")+'</div>';
    if(a.theme) inner += '<div class="hint">选择即定主题气韵</div>';
  } else {
    inner = fields.map(f=>'<div class="field"><label>'+f.label+'</label><input data-f="'+f.field+'" placeholder="'+f.ph+'" value="'+((state[f.field]||"").toString().replace(/"/g,'&quot;'))+'" /></div>').join("");
  }
  transitionTo('<div class="bubble"><span class="who">'+CHAR[sc.actor].name+'</span><p>'+line+'</p></div><div class="ask">'+inner+'<button class="btn" disabled>继 续</button></div>', ()=>{
    const btn = sceneEl.querySelector(".ask .btn");
    if(a.widget==="seg"){
      let chosen = a.def;
      if(chosen!==undefined){ state[a.field]=chosen; if(a.theme) setTheme(chosen); markSeg(); }
      else btn.disabled = true;
      btn.onclick = ()=>go(sc.next);
      sceneEl.querySelectorAll(".seg button").forEach(b=>{
        b.onclick = ()=>{ state[a.field]=b.dataset.v; if(a.theme) setTheme(b.dataset.v); markSeg(); if(btn.disabled) btn.disabled=false; };
      });
      function markSeg(){ sceneEl.querySelectorAll(".seg button").forEach(b=>b.classList.toggle("sel", b.dataset.v==String(state[a.field]))); }
    } else {
      const ins = sceneEl.querySelectorAll("input[data-f]");
      ins.forEach(i=>i.oninput=()=>{ btn.disabled = !(a.require||[]).every(f=>{ const el=sceneEl.querySelector('input[data-f="'+f+'"]'); return el && el.value.trim(); }); });
      btn.onclick = ()=>{
        fields.forEach(f=>{ state[f.field]=sceneEl.querySelector('input[data-f="'+f.field+'"]').value.trim(); });
        if(a.require && !a.require.every(f=>state[f])) return;
        go(sc.next);
      };
    }
    if(a.widget==="seg" && a.def!==undefined) btn.disabled=false;
  });
}

/* ---------- 汇总过目（可改） ---------- */
function fmtMode(){ return {F:"随父",M:"随母",B:"复姓双承"}[state.mode] || "（未选）"; }
function fmtLen(){ return {2:"两字",3:"三字",4:"四字"}[state.name_len] || "（未选）"; }
function fmtGender(){ return {M:"男孩",F:"女孩",U:"不限"}[state.gender] || "（未选）"; }
function renderSummary(sc){
  showActor(sc.actor);
  $("#step").textContent = sc.step || "过目";
  const rows = state.branch==="B"
    ? [["观测名字","name", state.name||"", "b1"], ["命格气韵","gender", fmtGender(), "b2"]]
    : [["父姓","father", state.father||"", "s04"], ["母姓","mother", state.mother||"", "s04"],
       ["名随何方","mode", fmtMode(), "s05"], ["姓名字数","name_len", fmtLen(), "s07"],
       ["命格气韵","gender", fmtGender(), "s08"]];
  let html = '<div class="bubble"><span class="who">'+(sc.actor?CHAR[sc.actor].name:"")+'</span><p>请小星主过目所录，确认或改动。</p></div><div class="summary">';
  rows.forEach(r=>{
    const empty = !r[2] || r[2]==="（未选）";
    html += '<div class="sumrow"><span class="sk">'+r[0]+'</span><span class="sv'+(empty?' empty':'')+'">'+(empty?'(未填)':r[2])+'</span><button class="edit" data-go="'+r[3]+'">改</button></div>';
  });
  html += '</div><button class="btn">确认无误 · 起卦</button>';
  transitionTo(html, ()=>{
    sceneEl.querySelectorAll(".edit").forEach(b=> b.onclick = ()=>go(b.dataset.go));
    sceneEl.querySelector(".btn").onclick = ()=>go(sc.next);
  });
}

/* ---------- 占算 ---------- */
function callAPI(){
  if(state.branch==="B"){
    return fetch("/api/analyze",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({name:state.name||"", gender:state.gender||"U", birth:null})}).then(r=>r.json());
  }
  return fetch("/api/generate",{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({father:state.father||"", mother:state.mother||"", mode:state.mode||"F",
      name_len:state.name_len||3, gender:state.gender||"U", tags:[], avoid:"", free_text:"", birth:null, weights:null})}).then(r=>r.json());
}
function enterRitual(){
  showActors("bagua"); $("#step").textContent="占算";
  apiPromise = callAPI();
  apiPromise.then(d=>{ state.result=d; }).catch(e=>{ state.result={meta:{error:"推算中断："+e.message}}; });
  let i=0;
  sceneEl.innerHTML = '<div id="ritual"><div class="orbit"></div><div class="line"></div>'+
    '<button class="btn ghost" style="max-width:160px;margin:18px auto 0">跳过演出</button></div>';
  const lineEl = sceneEl.querySelector(".line");
  const skip = sceneEl.querySelector(".btn");
  function step(){
    if(i<RITUAL.length){
      const r=RITUAL[i]; showActors(r.keys||[r.key]);
      lineEl.classList.add("fade");
      setTimeout(()=>{ lineEl.textContent=r.line; lineEl.classList.remove("fade"); }, 260);
      i++; state._rt=setTimeout(step,1700);
    } else { showActors("xingshi"); go("s10"); }
  }
  skip.onclick = ()=>{ clearTimeout(state._rt); showActors("xingshi"); go("s10"); };
  step();
}

/* ---------- 静待揭晓 ---------- */
function renderWait(loading){
  showActor("xingshi"); $("#step").textContent="静待揭晓";
  const all = ["assistant","ziyuan","yuwen","zhanxing","yijing","bagua","xingshi","shengxiao","shuli","wuxing","yinlv","xingtai"];
  let crowd = '<div class="crow">'+all.slice(0,12).map(k=>'<img src="'+CHAR[k].file+'" alt="" onerror="this.style.display=\'none\'"/>').join("")+'</div>';
  if(loading){
    sceneEl.innerHTML = crowd + '<div class="tip">诸师同参，推算中…</div><div class="spinner"></div>';
    return;
  }
  if(state.result && state.result.meta && state.result.meta.error){
    sceneEl.innerHTML = '<div class="bubble"><p>'+state.result.meta.error+'</p></div>'+
      '<button class="btn" onclick="location.reload()">重新起卦</button>';
    return;
  }
  sceneEl.innerHTML = crowd +
    '<div class="tip">万事俱备，只待小星主点定</div>'+
    '<button class="btn" id="revealBtn">揭 晓</button>';
  $("#revealBtn").onclick = doReveal;
}

/* ---------- 揭晓 + 结果 ---------- */
function doReveal(){
  const flash = $("#flash"); flash.classList.add("on");
  setTimeout(()=>flash.classList.remove("on"), 280);
  setTimeout(()=>{ renderResult(); }, 520);
}
function renderResult(){
  showActor(null);
  const data = state.result || {names:[]};
  const names = data.names || [];
  const wrap = $("#result");
  if(!names.length){
    wrap.innerHTML = '<h2>星师详解</h2><div class="bubble"><p>未得佳名，或条件过苛。请放宽寓意或调整姓氏方式，再起一卦。</p></div>'+
      '<div id="resultFoot"><button class="btn" onclick="location.reload()">重新起卦</button></div>';
    wrap.classList.add("show"); wrap.scrollTop=0; return;
  }
  let html = '<h2>星师荐名 · 共 '+names.length+' 枚</h2>';
  names.slice(0,8).forEach((n,idx)=>{
    const dims = DIMS.map(([k,cn])=>{
      const v = n.dims ? n.dims[k] : null;
      const w = (v==null)?0:v;
      const na = (v==null)?' na':'';
      return '<div class="dim"><div class="dl"><span>'+cn+'</span><span>'+(v==null?'—':v)+'</span></div>'+
        '<div class="bar"><i class="'+na.trim()+'" style="width:'+w+'%"></i></div></div>';
    }).join("");
    const ex = (n.explain||[]).map(e=>'<div class="ei"><b>'+e.label+'</b>'+e.text+'</div>').join("");
    const reason = n.rank_reason ? '<div class="preason">★ 推荐理由：'+n.rank_reason+'</div>' : '';
    html += '<div class="plate" data-i="'+idx+'">'+
      '<span class="pscore">综合 '+n.total+'</span>'+
      '<div class="pname">'+n.name+'</div>'+ reason +
      '<div class="dims">'+dims+'</div>'+
      '<button class="toggle">展开细项分析 ▾</button>'+
      '<div class="explain">'+ex+'</div></div>';
  });
  html += '<div id="resultFoot"><button class="btn ghost" onclick="location.reload()">重新起卦</button></div>';
  wrap.innerHTML = html; wrap.classList.add("show"); wrap.scrollTop=0;
  wrap.querySelectorAll(".plate").forEach((p,i)=>{
    setTimeout(()=>p.classList.add("in"), 80*i+60);
    p.querySelector(".toggle").onclick = ()=>{
      const ex=p.querySelector(".explain"); ex.classList.toggle("show");
      p.querySelector(".toggle").textContent = ex.classList.contains("show")?"收起细项分析 ▴":"展开细项分析 ▾";
    };
  });
}

/* 启动 */
go("brand");
</script>
</body>
</html>
