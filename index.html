<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>星命观测局 · 为小星主推演佳名</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  :root{
    /* 低饱和「藕荷玫瑰」体系：暖灰粉底 + 玫瑰灰主色，柔和不刺眼 */
    --bg:#f7f2f3; --bg2:#fdfafb; --card:#ffffff;
    --ink:#3c3035; --sub:#94848b; --line:#ebe1e4;
    --acc:#ab6379; --acc2:#d9b0bc; --tint:#f7eff2; --tint2:#efe2e7;
    --good:#a56d80; --warn:#a8825c; --danger:#a75f6c;
    --sh1:0 1px 2px rgba(78,52,61,.045);
    --sh2:0 10px 28px rgba(78,52,61,.06);
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    color:var(--ink);-webkit-font-smoothing:antialiased;background-color:var(--bg);
    background-image:radial-gradient(92% 46% at 50% 0%,#fdf7f8 0%,rgba(253,247,248,0) 72%),
      linear-gradient(180deg,#f8f3f4 0%,#f3edef 100%);
    background-attachment:fixed;}
  .wrap{max-width:480px;margin:0 auto;padding:22px 16px 60px;}
  .top{text-align:center;margin-bottom:18px;}
  .top h1{font-size:22px;margin:0 0 4px;font-weight:600;letter-spacing:2px;}
  .top p{margin:0;color:var(--sub);font-size:13px;}
  .steps-dot{display:flex;justify-content:center;gap:6px;margin:14px 0 18px;}
  .steps-dot i{width:7px;height:7px;border-radius:50%;background:var(--line);display:block;transition:.3s;}
  .steps-dot i.on{background:var(--acc);width:18px;border-radius:4px;}
  .card{background:linear-gradient(180deg,#ffffff 0%,#fffdfe 100%);border:1px solid var(--line);
    border-radius:18px;padding:20px 18px;box-shadow:var(--sh1),var(--sh2);}
  .card h2{font-size:17px;margin:0 0 4px;font-weight:600;letter-spacing:.5px;}
  .card .hint{color:var(--sub);font-size:12.5px;margin:0 0 16px;line-height:1.6;}
  label.f{display:block;font-size:13px;color:var(--sub);margin:14px 0 6px;}
  input[type=text],input[type=date],input[type=time]{width:100%;padding:12px 14px;border:1px solid var(--line);
    border-radius:12px;font-size:15px;background:var(--bg2);color:var(--ink);outline:none;transition:.15s;}
  input:focus{border-color:var(--acc2);box-shadow:0 0 0 3px rgba(171,99,121,.10);}
  .row{display:flex;gap:10px;}
  .seg{display:flex;gap:8px;flex-wrap:wrap;}
  .seg button{flex:1;min-width:84px;padding:11px;border:1px solid var(--line);background:var(--bg2);border-radius:12px;
    font-size:14px;color:var(--ink);cursor:pointer;transition:.15s;}
  .seg button:hover{background:var(--tint);}
  .seg button.sel{background:linear-gradient(180deg,#b96e84,#a35c73);color:#fff;border-color:#a35c73;
    box-shadow:0 4px 12px rgba(171,99,121,.20);}
  .seg button:disabled{opacity:.35;cursor:not-allowed;}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px;}
  .chip{padding:8px 13px;border:1px solid var(--line);background:var(--bg2);border-radius:20px;font-size:13px;
    cursor:pointer;transition:.15s;color:var(--ink);}
  .chip:hover{background:var(--tint);}
  .chip.sel{background:linear-gradient(180deg,#b96e84,#a35c73);color:#fff;border-color:#a35c73;
    box-shadow:0 4px 12px rgba(171,99,121,.18);}
  .order{display:flex;flex-direction:column;gap:10px;margin-top:6px;}
  .order .it{display:flex;align-items:center;gap:10px;background:var(--bg2);border:1px solid var(--line);
    border-radius:13px;padding:12px 12px;cursor:grab;transition:box-shadow .15s, border-color .15s;will-change:transform;}
  .order .it.drag{opacity:.4;}
  .order .it .grip{color:var(--sub);opacity:.5;font-size:18px;line-height:1;cursor:grab;user-select:none;
    flex:0 0 auto;width:14px;text-align:center;letter-spacing:-3px;}
  .order .it .no{width:24px;height:24px;border-radius:50%;background:var(--tint2);color:var(--acc);font-size:12px;
    font-weight:600;display:flex;align-items:center;justify-content:center;flex:0 0 auto;}
  .order .it .nm{flex:1;font-size:15px;font-weight:500;}
  .order .it .mv{display:flex;flex-direction:column;gap:6px;flex:0 0 auto;}
  .order .it .mv button{width:42px;height:34px;border:none;border-radius:11px;
    background:linear-gradient(180deg,#b96e84,#a35c73);color:#fff;font-size:15px;font-weight:700;
    cursor:pointer;line-height:1;box-shadow:0 4px 11px rgba(171,99,121,.30);
    transition:transform .12s, box-shadow .12s, opacity .12s;
    display:flex;align-items:center;justify-content:center;}
  .order .it .mv button:active{transform:scale(.9);box-shadow:0 1px 4px rgba(171,99,121,.34);}
  .order .it .mv button:disabled{opacity:.3;background:var(--tint2);color:var(--sub);box-shadow:none;cursor:default;transform:none;}
  .nav{display:flex;gap:10px;margin-top:20px;}
  .btn{flex:1;padding:13px;border-radius:13px;border:none;font-size:15px;font-weight:600;cursor:pointer;transition:.15s;}
  .btn.ghost{background:var(--tint);color:var(--sub);}
  .btn.ghost:hover{background:var(--tint2);}
  .btn.prim{background:linear-gradient(180deg,#b96e84,#a35c73);color:#fff;
    box-shadow:0 6px 18px rgba(171,99,121,.22);}
  .btn.prim:active{transform:scale(.98);}
  .opt{display:flex;align-items:center;gap:8px;margin-top:14px;color:var(--sub);font-size:13px;}
  .ritual{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:50;
    color:#fff;padding:18px;
    background:radial-gradient(120% 85% at 50% 0%,#a8808f 0%,#7d5666 48%,#523644 100%);}
  .ritual.show{display:flex;}
  .ritual .panel{width:88%;max-width:700px;background:rgba(255,255,255,.09);
    border:1px solid rgba(255,255,255,.18);border-radius:24px;padding:26px 22px 20px;
    box-shadow:0 24px 70px rgba(46,30,38,.38);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    display:flex;flex-direction:column;align-items:center;}
  .ritual .orb{width:62px;height:62px;border-radius:50%;border:3px solid rgba(255,255,255,.32);
    border-top-color:#fff;animation:spin 1s linear infinite;margin-bottom:15px;
    box-shadow:0 0 26px rgba(255,255,255,.40);}
  @keyframes spin{to{transform:rotate(360deg)}}
  .ritual .rtitle{font-size:15px;letter-spacing:3px;font-weight:600;opacity:.92;margin-bottom:16px;}
  .ritual .log{width:100%;max-height:54vh;overflow-y:auto;overflow-x:auto;text-align:left;
    display:flex;flex-direction:column;gap:9px;padding:2px 4px;}
  .ritual .log::-webkit-scrollbar{width:5px;}
  .ritual .log::-webkit-scrollbar-thumb{background:rgba(255,255,255,.3);border-radius:3px;}
  .ritual .msg{font-size:13.5px;line-height:1.6;letter-spacing:.3px;opacity:.94;white-space:nowrap;
    background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.18);
    border-left:3px solid rgba(255,255,255,.55);border-radius:10px;padding:9px 13px;}
  .ritual .msg.sum{background:rgba(255,255,255,.22);border-color:rgba(255,255,255,.42);
    border-left-color:#e6c898;font-weight:600;color:#fff;}
  @keyframes msgIn{from{opacity:0;transform:translateY(18px);}to{opacity:.94;transform:translateY(0);}}
  .ritual .msg.show-anim{animation:msgIn .5s cubic-bezier(.22,.61,.36,1) both;}
  .ritual .sub{font-size:12px;opacity:.72;margin-top:15px;text-align:center;padding:0 18px;}
  /* 触屏拖拽时的高亮态（仅 touch 拖拽使用，与 PC 原生拖拽 .drag 并存不冲突） */
  .order .it.drag-touch{box-shadow:0 16px 34px rgba(78,52,61,.30);border-color:var(--acc);
    background:var(--tint);z-index:5;cursor:grabbing;}
  /* 移动端：推演文字自动换行、关闭横向滚动（PC 宽屏仍保持单行 nowrap） */
  @media (max-width:680px){
    .ritual .log{overflow-x:hidden;}
    .ritual .msg{white-space:normal;overflow-wrap:anywhere;word-break:break-word;}
  }
  .divider{display:flex;align-items:center;gap:10px;margin:22px 0 4px;color:var(--sub);font-size:12px;}
  .divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--line);}
  .sum{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:16px;
    font-size:13px;color:var(--sub);line-height:1.7;box-shadow:var(--sh1);}
  .sum b{color:var(--ink);}
  .name-card{background:linear-gradient(180deg,#ffffff 0%,#fffdfe 100%);border:1px solid var(--line);
    border-radius:18px;padding:0;margin-bottom:13px;
    cursor:pointer;transition:.2s;overflow:hidden;box-shadow:var(--sh1),var(--sh2);}
  .name-card:hover{border-color:var(--acc2);transform:translateY(-1px);
    box-shadow:0 2px 4px rgba(78,52,61,.05),0 14px 32px rgba(78,52,61,.09);}
  .name-card .topbar{height:6px;background:linear-gradient(90deg,var(--acc2),var(--acc));opacity:.85;}
  .name-card .body{padding:15px 16px 14px;}
  .name-card .hd{display:flex;align-items:baseline;justify-content:space-between;}
  .name-card .nm{font-size:26px;font-weight:700;letter-spacing:3px;}
  .name-card .py{font-size:13px;color:var(--sub);margin-left:10px;font-weight:400;letter-spacing:1px;}
  .name-card .sc{font-size:12px;color:#fff;background:linear-gradient(135deg,#c1849a,#a35c73);
    padding:4px 11px;border-radius:12px;font-weight:600;white-space:nowrap;}
  .name-card .tags{margin-top:8px;display:flex;gap:6px;flex-wrap:wrap;}
  .name-card .tags span{font-size:11px;color:var(--good);background:var(--tint);border:1px solid var(--line);
    padding:2px 8px;border-radius:8px;}
  .name-card .dims{margin-top:11px;display:grid;grid-template-columns:1fr 1fr;gap:5px 14px;}
  .name-card .dim{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--sub);}
  .name-card .dim .dl{width:32px;flex:none;}
  .name-card .dim .db{flex:1;height:6px;border-radius:4px;background:var(--tint2);overflow:hidden;}
  .name-card .dim .db i{display:block;height:100%;background:linear-gradient(90deg,var(--acc2),var(--acc));}
  .name-card .dim .dv{width:24px;text-align:right;color:var(--ink);font-weight:600;flex:none;}
  .name-card .acts{margin-top:12px;display:flex;gap:8px;}
  .name-card .acts button{flex:1;border:1px solid var(--line);background:var(--tint);color:var(--acc);border-radius:10px;
    padding:7px;font-size:12.5px;cursor:pointer;transition:.15s;}
  .name-card .acts button:hover{background:var(--tint2);}
  .name-card .acts button:disabled{opacity:.55;cursor:default;background:var(--tint2);}
  .name-card .acts button.save{background:linear-gradient(180deg,#bd7589,#a35c73);color:#fff;border-color:#a35c73;
    font-weight:600;box-shadow:0 4px 12px rgba(171,99,121,.22);}
  .name-card .acts button.save:hover{filter:brightness(1.05);}
  .detail{max-height:0;overflow:hidden;transition:max-height .35s ease;}
  .name-card.open .detail{max-height:2400px;}
  .detail .d{padding:12px 2px 2px;border-top:1px dashed var(--line);margin-top:11px;}
  .detail .d .k{font-size:13px;font-weight:600;color:var(--acc);margin-bottom:3px;}
  .detail .d .k.approx{color:var(--warn);}
  .detail .d .t{font-size:13px;color:var(--ink);line-height:1.7;}
  .name-card .ai-box{margin-top:12px;padding:11px 12px;background:linear-gradient(135deg,var(--tint),#fffcfd);
    border:1px solid var(--line);border-left:3px solid var(--acc2);border-radius:12px;display:none;}
  .name-card .ai-box.show{display:block;}
  .name-card .ai-box .k{font-size:13px;font-weight:600;color:var(--acc);margin-bottom:5px;}
  .name-card .ai-box .t{font-size:13px;color:var(--ink);line-height:1.7;}
  /* 每卡片自带的导出底图：默认隐藏，导出时临时移出视口截图，节点始终在卡片子树内，绝不残留到页面底部 */
  .name-card .export-sheet{display:none;}
  .hidden{display:none!important;}
  .res-top{display:flex;justify-content:flex-start;margin-bottom:10px;}
  .home-btn{font-size:13px;color:var(--acc);background:var(--card);border:1px solid var(--line);
    padding:6px 14px;border-radius:20px;cursor:pointer;transition:.15s;box-shadow:var(--sh1);}
  .home-btn:hover{background:var(--tint);}
  .err{color:var(--danger);font-size:12.5px;margin-top:10px;}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1>星命观测局</h1>
    <p>为即将降临的小星主，推演一个恰好的名号</p>
  </div>
  <div class="steps-dot" id="dots"><i class="on"></i><i></i><i></i><i></i></div>

  <!-- STEP 1 -->
  <section class="card" id="step1">
    <h2>第一步 · 血脉与字数</h2>
    <p class="hint">填写父母姓氏，选择随谁姓、名字共几字。系统会据此校验并推演。</p>
    <label class="f">父亲姓氏</label>
    <input type="text" id="father" placeholder="如：林" maxlength="2" oninput="refreshLen()" />
    <label class="f">母亲姓氏</label>
    <input type="text" id="mother" placeholder="如：苏" maxlength="2" oninput="refreshLen()" />
    <label class="f">姓氏方式</label>
    <div class="seg" id="mode">
      <button data-mode="F" class="sel">随父姓</button>
      <button data-mode="M">随母姓</button>
      <button data-mode="B">都要体现</button>
    </div>
    <label class="f">名字字数（含姓氏，总数严格按此）</label>
    <div class="seg" id="nameLen">
      <button data-len="2">双字名</button>
      <button data-len="3" class="sel">三字名</button>
      <button data-len="4">四字名</button>
    </div>
    <label class="f">性别倾向</label>
    <div class="seg" id="gender">
      <button data-g="M">男孩</button>
      <button data-g="F">女孩</button>
      <button data-g="U" class="sel">不限</button>
    </div>
    <label class="f">预产 / 出生时间（可选）</label>
    <div class="row">
      <input type="date" id="bday" />
      <input type="time" id="btime" value="12:00" />
    </div>
    <div class="opt"><input type="checkbox" id="nobirth" /> 暂不填写生辰，只看字义音律</div>
    <label class="f">对宝宝期许（自由描述，可选，星师据意推演寓意）</label>
    <input type="text" id="freeText" placeholder="如：希望豁达开朗、有见识、一生平安" />
    <div class="err hidden" id="step1Err"></div>
    <div class="nav">
      <button class="btn prim" onclick="go(2)">下一步</button>
    </div>

    <div class="divider">或者，已有心仪的名字？</div>
    <label class="f">帮我观测我的候选名字（输入后将跳过其它步骤，直接推算）</label>
    <input type="text" id="candName" placeholder="如：林婉婷 / 苏沐辰" maxlength="8" />
    <div class="err hidden" id="candErr"></div>
    <div class="nav">
      <button class="btn prim" onclick="analyzeOnly()">✨ 直接观测这个名字</button>
    </div>
  </section>

  <!-- STEP 2 -->
  <section class="card hidden" id="step2">
    <h2>第二步 · 看重什么</h2>
    <p class="hint">把您最在意的维度排到前面：可直接拖动卡片（左侧有抓手），或点右侧 ↑↓ 箭头微调。我们会据此为名字加权。</p>
    <div class="order" id="order"></div>
    <div class="nav">
      <button class="btn ghost" onclick="go(1)">上一步</button>
      <button class="btn prim" onclick="go(3)">下一步</button>
    </div>
  </section>

  <!-- STEP 3 -->
  <section class="card hidden" id="step3">
    <h2>第三步 · 寓意倾向</h2>
    <p class="hint">选几个您喜欢的意境（可多选）。不选则全面考虑。</p>
    <div class="chips" id="tagChips"></div>
    <div class="err hidden" id="genErr"></div>
    <div class="nav">
      <button class="btn ghost" onclick="go(2)">上一步</button>
      <button class="btn prim" id="genBtn" onclick="startRitual(false)">开始推算 ✦</button>
    </div>
  </section>

  <!-- RESULTS -->
  <section id="results" class="hidden">
    <div class="res-top">
      <button class="home-btn" onclick="goHome()" title="返回首页">← 返回首页</button>
    </div>
    <div class="sum" id="summary"></div>
    <div id="list"></div>
    <div class="err hidden" id="errmsg"></div>
  </section>
</div>

<!-- RITUAL -->
<div class="ritual" id="ritual">
  <div class="panel">
    <div class="orb"></div>
    <div class="rtitle">星命观测局 · 推演中</div>
    <div class="log" id="ritualLog"></div>
    <div class="sub">众位老师正为您调和天地人三才</div>
  </div>
</div>

<script>
const ORDER_DEF = [
  {k:'meaning', n:'字义寓意'},
  {k:'pronounce', n:'音律朗朗'},
  {k:'wuxing', n:'五行调和'},
  {k:'zodiac', n:'生肖相宜'},
  {k:'stroke', n:'字形匀称'},
];
// —— 推算仪式：老师独白 + 老师间趣味互动（预置短句库，随机展示，不耗 AI）——
const SOLO = [
  '占星老师正在描摹星盘走向…','八卦老师正在推演先天卦象…','语文老师正在斟酌平仄字句…',
  '五行老师正在调和金木水火土…','姓名学老师正在比对吉数格局…','音律老师正在试读音韵清浊…',
  '字形老师正在端详间架结构…','生肖老师正在参详属相喜忌…','数理老师正在核算笔画理数…',
  '意境老师正在营造画面气韵…'
];
const BANTER = [
  '语文老师灵光一闪，提了个妙字，却被五行老师笑着摇头：“此字属性不合，且慢。”',
  '五行老师刚布好气场，八卦老师凑过来指了指卦象，两人相视一笑，默契十足。',
  '占星老师抛出星盘走向，姓名学老师立刻记下吉数，提笔便添一笔。',
  '音律老师试读两遍，皱眉道“此处略拗”，字形老师点头：“我来调一调结构。”',
  '生肖老师翻出喜忌表，意境老师会心：“正合我心中那幅画。”',
  '数理老师算出理数偏低，语文老师宽慰：“数理之外，更有文心。”',
  '八卦老师一拍案：“此象大吉！”五行老师点头：“与八字正合。”',
  '语文老师与音律老师为平仄争了几句，最终握手：“此读音最妥。”',
  '意境老师铺开画卷，生肖老师惊呼：“这分明是祥瑞之兆！”',
  '五行老师调和完毕，占星老师遥指天际：“时机已到，落笔吧。”',
  '姓名学老师比对吉数后犹豫，数理老师笑道：“差之毫厘，无妨大局。”',
  '字形老师端详良久，音律老师轻声念出，竟格外顺口，众人皆喜。',
  '八卦老师算得一卦，五行老师补上一句：“此卦得土生金，根基愈稳。”',
  '语文老师想用生僻字显深意，意境老师拦下：“名字是唤一辈子的，还是亲切些好。”',
  '占星老师与生肖老师对了对时辰，齐声：“此子得天护佑。”',
  '数理老师、姓名学老师围着吉数推敲半晌，终成一格。',
  '音律老师哼起小调，字形老师跟着比划，画面感顿生。',
  '五行老师问生肖老师：“喜用何部？”生肖老师展卷：“草本、宝盖最佳。”',
  '意境老师与语文老师合拟一句题跋，温润又有筋骨。',
  '八卦老师捋须：“卦象已圆。”占星老师笑：“星河亦点头。”',

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
const TICK = 1500;         // 每行出现的间隔（放慢：1500ms/句）
const LAST_DWELL = 1400;   // 最后一行显示后，额外停留时间
// —— 汇总 / 归纳类文案：作为仪式收尾，置于队列最后，表示进入归纳阶段 ——
const SUMMARY = [
  '众位老师颔首：星象已明，字义已定，一份名单正悄然成形。',
  '推演将歇，佳名呼之欲出——请静候君之一见倾心。',
  '天地人三才既济，音形义俱谐，只待您亲手点定。'
];
function buildRitualQueue(){
  const main = shuffle(SOLO).slice(0,4).concat(shuffle(BANTER).slice(0,4));
  const q = shuffle(main).map(t=>({text:t, type:'line'}));
  shuffle(SUMMARY).slice(0,2).forEach(t=>q.push({text:t, type:'summary'}));
  return q;
}
function addRitualLine(txt, type){
  const log=document.getElementById('ritualLog');
  const el=document.createElement('div');
  el.className='msg'+(type==='summary'?' sum':'');
  el.textContent=txt;
  log.appendChild(el);
  void el.offsetWidth;          // 强制 reflow，重触发入场动效
  el.classList.add('show-anim');
  log.scrollTop = log.scrollHeight;  // 自动滚到最新一行
}

// order list (drag + arrows)
let dragIdx=null;
let touchState=null;
function renderOrder(){
  const box=document.getElementById('order'); box.innerHTML='';
  state.order.forEach((it,i)=>{
    const el=document.createElement('div'); el.className='it'; el.draggable=true; el.dataset.idx=i;
    el.innerHTML=`<div class="grip">⋮⋮</div><div class="no">${i+1}</div><div class="nm">${it.n}</div>
      <div class="mv">
        <button ${i===0?'disabled':''} onclick="move(${i},-1)" aria-label="上移">▲</button>
        <button ${i===state.order.length-1?'disabled':''} onclick="move(${i},1)" aria-label="下移">▼</button>
      </div>`;
    el.addEventListener('dragstart',()=>{dragIdx=i; el.classList.add('drag');});
    el.addEventListener('dragend',()=>{el.classList.remove('drag'); dragIdx=null;});
    el.addEventListener('dragover',e=>e.preventDefault());
    el.addEventListener('drop',e=>{e.preventDefault();
      if(dragIdx===null||dragIdx===i) return;
      const [m]=state.order.splice(dragIdx,1); state.order.splice(i,0,m); dragIdx=null; renderOrder();});
    // 触屏拖拽：原生 HTML5 DnD 在手机上不触发，此处用 touch 事件补齐（与 PC 鼠标拖拽并存）
    el.addEventListener('touchstart',onTouchStart,{passive:true});
    box.appendChild(el);
  });
}
// 触屏拖拽：被拖项悬浮跟随手指，其余项平滑让位（FLIP 式滑动），松手落位（替代原生 DnD 的生硬切换）
function onTouchStart(e){
  if(e.target.closest('button')) return;            // 点箭头按钮不触发拖拽
  const el=this, box=document.getElementById('order');
  const items=[...box.children];
  // 关键：相邻两项间距 stride 与“抓取的是哪一项”无关；旧写法用 children[1].top-el.top，
  // 抓非首项时 stride 变成负数/异常值，导致目标计算与落位全错（拖拽成功率低的根因）。
  const stride = items.length>1
    ? items[1].getBoundingClientRect().top - items[0].getBoundingClientRect().top
    : (el.offsetHeight+10);
  touchState={el, box, items,
    firstIdx:+el.dataset.idx, targetIdx:+el.dataset.idx, startY:e.touches[0].clientY,
    stride, baseTops:items.map(it=>it.getBoundingClientRect().top), dragging:false};
  document.addEventListener('touchmove',onTouchMoveDoc,{passive:false});
  document.addEventListener('touchend',onTouchEndDoc);
}
function shiftOthers(){
  const {el,box,firstIdx,stride,targetIdx}=touchState;
  [...box.children].forEach((it,k)=>{
    if(it===el) return;
    let ty=0;
    if(targetIdx>firstIdx && k>firstIdx && k<=targetIdx) ty=-stride;
    else if(targetIdx<firstIdx && k>=targetIdx && k<firstIdx) ty=stride;
    it.style.transition='transform .2s cubic-bezier(.22,.61,.36,1)';
    it.style.transform = ty ? `translateY(${ty}px)` : '';
  });
}
function onTouchMoveDoc(e){
  if(!touchState) return;
  const y=e.touches[0].clientY, dy=y-touchState.startY;
  if(!touchState.dragging){
    if(Math.abs(dy)<8) return;
    touchState.dragging=true;
    touchState.el.style.transition='none';         // 仅在真正拖动后才“拎起”，避免误触滚动时抬起重影
    touchState.el.classList.add('drag-touch');
    touchState.el.style.zIndex=5; touchState.el.style.position='relative';
  }
  e.preventDefault();                              // 拖拽中阻止页面滚动
  touchState.el.style.transform=`translateY(${dy}px) scale(1.03)`;
  const {el,items,baseTops,stride}=touchState;
  let target=0;
  items.forEach((it,k)=>{ if(it===el) return; if(y > baseTops[k]+stride/2) target++; });
  target=Math.max(0,Math.min(state.order.length-1,target));
  if(target!==touchState.targetIdx){ touchState.targetIdx=target; shiftOthers(); }
}
function onTouchEndDoc(){
  if(touchState){
    const {el,firstIdx,targetIdx,stride}=touchState;
    el.style.transition='transform .22s cubic-bezier(.22,.61,.36,1)';
    el.style.transform=`translateY(${(targetIdx-firstIdx)*stride}px) scale(1.03)`;
    setTimeout(()=>{
      const [m]=state.order.splice(firstIdx,1); state.order.splice(targetIdx,0,m);
      el.classList.remove('drag-touch'); el.style.cssText='';
      renderOrder();
    }, 220);
  }
  touchState=null;
  document.removeEventListener('touchmove',onTouchMoveDoc);
  document.removeEventListener('touchend',onTouchEndDoc);
}
// 箭头上/下移：FLIP 滑动过渡（被移动项与交换项反向滑入，0.26s 缓动），比瞬间跳变更顺滑
function move(i,d){
  const j=i+d; if(j<0||j>=state.order.length) return;
  const box=document.getElementById('order');
  const items=[...box.children];
  const fromTop=items[i].getBoundingClientRect().top;
  const toTop=items[j].getBoundingClientRect().top;
  const dy=toTop-fromTop;                          // 被移动项需平移的距离（i→j）
  [state.order[i],state.order[j]]=[state.order[j],state.order[i]];
  renderOrder();
  const items2=[...box.children];
  const movedEl=items2[j];                         // 现在显示原 items[i] 的内容（落到 j）
  const otherEl=items2[i];                         // 现在显示原 items[j] 的内容（落到 i）
  movedEl.style.transition='none'; otherEl.style.transition='none';
  movedEl.style.transform=`translateY(${-dy}px)`;  // 先瞬移回原位置
  otherEl.style.transform=`translateY(${dy}px)`;
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    const t='transform .26s cubic-bezier(.22,.61,.36,1)';
    movedEl.style.transition=t; otherEl.style.transition=t;
    movedEl.style.transform=''; otherEl.style.transform='';
  }));
}

function weightsFromOrder(){
  const rw=[0.28,0.20,0.16,0.12,0.08];
  const w={homophone:0.08,gender:0.08};
  state.order.forEach((it,i)=>w[it.k]=rw[i]);

// ritual
let ritualTimer=null, ritualCheck=null, ritualRunning=false;
function startRitual(analyzeMode){
  if(ritualRunning) return;            // 防止重复触发导致多个计时器叠加、页面反复重渲染
  ritualRunning=true;
  const genBtn=document.getElementById('genBtn'); if(genBtn) genBtn.disabled=true;
  const payload = analyzeMode
    ? {name: state.analyzeName, gender:'U', birth:null}
    : (()=>{
        const father=document.getElementById('father').value.trim();
        const mother=document.getElementById('mother').value.trim();
        if(!father||!mother){alert('请先填写父母姓氏');go(1);return null;}
        const nobirth=document.getElementById('nobirth').checked;
        const bday=document.getElementById('bday').value;
        let birth=null;
        if(!nobirth && bday){
          const [y,m,d]=bday.split('-').map(Number);
          const [hh]=document.getElementById('btime').value.split(':').map(Number);
          birth={year:y,month:m,day:d,hour:hh||12};
        }
        return {father, mother, mode:state.mode, name_len:state.nameLen,
          gender:state.gender, tags:[...state.tags], avoid:'',
          free_text:document.getElementById('freeText').value.trim(), birth, weights:weightsFromOrder()};
      })();
  if(!payload){ if(genBtn) genBtn.disabled=false; ritualRunning=false; return; }

  const endpoint = analyzeMode ? '/api/analyze' : '/api/generate';
  const ritual=document.getElementById('ritual');
  const fail=(msg, errId)=>{
    clearInterval(ritualTimer); clearInterval(ritualCheck);
    ritual.classList.remove('show');
    if(genBtn) genBtn.disabled=false;
    ritualRunning=false;
    const e=document.getElementById(errId); e.textContent=msg; e.classList.remove('hidden');
  };
  document.getElementById('genErr').classList.add('hidden');
  ritual.classList.add('show');
  const log=document.getElementById('ritualLog');
  log.innerHTML='';
  const queue=buildRitualQueue();
  const RITUAL_MS = queue.length * TICK + LAST_DWELL;
  let qi=0;
  addRitualLine(queue[0].text, queue[0].type); qi=1;
  const t0=Date.now();
  ritualTimer=setInterval(()=>{
    if(qi>=queue.length){ clearInterval(ritualTimer); return; }
    addRitualLine(queue[qi].text, queue[qi].type); qi++;
  }, TICK);
  state.data=null;
  const finish=()=>{
    clearInterval(ritualTimer); clearInterval(ritualCheck);
    ritual.classList.remove('show');
    if(genBtn) genBtn.disabled=false;
    ritualRunning=false;
    try { renderResults(state.data); } catch(err){ console.error('renderResults 出错：', err); }
    go(4);
  };
  fetch(endpoint,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)})
    .then(r=>r.json()).then(data=>{
      if(data.meta && data.meta.error){
        fail('⚠️ '+data.meta.error, analyzeMode?'candErr':'genErr');
        return;
      }
      state.data=data;
  }).catch(e=>{
    fail(analyzeMode ? '⚠️ 观测失败：无法连接取名服务。请确认通过服务地址打开本页。'
                     : '⚠️ 推算失败：无法连接取名服务。请确认通过服务地址打开本页，而非静态文件预览。',
         analyzeMode?'candErr':'genErr');
  });
  // 动画至少播满 RITUAL_MS，且数据已就位，才亮结果
  ritualCheck=setInterval(()=>{
    if(state.data && (Date.now()-t0)>=RITUAL_MS) finish();
  }, 200);
}

        </div>
        <div style="margin-top:8px;">${exTags}</div>
        <div style="margin-top:14px;padding-top:12px;border-top:1px solid #f0e6ea;">${exDims}</div>
        <div style="margin-top:13px;padding-top:12px;border-top:1px solid #ebe1e4;">${exDetail}</div>
        <div class="ai-wrap"></div>
        <div style="margin-top:16px;text-align:center;font-size:11px;color:#b3a1a8;letter-spacing:1px;">星命观测局 · 星师推演</div>
      </div></div></div>`;
    const card=document.createElement('div'); card.className='name-card'; card.id='card'+idx;
    card.innerHTML=`<div class="topbar"></div><div class="body">
      <div class="hd"><div><span class="nm">${o.name}</span><span class="py">${o.py_str}</span></div><span class="sc">综合 ${o.total}</span></div>
      <div class="tags">${tags}</div>
      <div class="dims">${dimsHtml}</div>
      <div class="acts">
        <button id="aiBtn${idx}" onclick="event.stopPropagation();callAiReview(${idx})">✦ 星师详解</button>
        <button class="save" onclick="event.stopPropagation();saveCard(${idx})">📸 导出此名图片</button>
      </div>
      <div class="ai-box" id="aiBox${idx}"></div>
      <div class="detail">${exp}</div>
      ${sheet}
    </div>`;
    card.onclick=()=>card.classList.toggle('open');
    list.appendChild(card);
  });
}

function saveCard(idx){
  // 截取该名字卡片内自带的 .export-sheet（节点始终在卡片子树里，绝不会跑到页面底部）
  const card=document.getElementById('card'+idx);
  const sheet=document.getElementById('sheet'+idx);
  const o=state.data.names[idx];
  if(!card||!sheet||!o) return;
  const btn=card.querySelector('.acts button.save');
  const oldText=btn?btn.textContent:'';
  if(btn){ btn.disabled=true; btn.textContent='生成中…'; }
  // 已生成的星师详解（若有）填入底图
  const aiWrap=sheet.querySelector('.ai-wrap');
  if(aiWrap) aiWrap.innerHTML = o.ai_review
    ? `<div style="margin-top:12px;padding:10px 12px;background:linear-gradient(135deg,#f7eff2,#fffcfd);border-radius:12px;border:1px solid #ebe1e4;border-left:3px solid #d9b0bc;"><div style="font-size:12.5px;font-weight:700;color:#ab6379;margin-bottom:4px;">✦ 星师详解</div><div style="font-size:12.5px;color:#3c3035;line-height:1.7;">${o.ai_review}</div></div>`
    : '';
  // 临时移出视口渲染（仍是卡片子树内的子节点，截图后立刻隐藏，不会出现页面底部残留元素）
  const prev=sheet.getAttribute('style')||'';
  sheet.setAttribute('style','position:fixed;left:-9999px;top:0;display:block;width:380px;z-index:-1;');
  let done=false;
  const restore=()=>{ if(done) return; done=true; sheet.setAttribute('style',prev); if(btn){ btn.disabled=false; btn.textContent=oldText; } };
  setTimeout(restore, 12000); // 兜底：html2canvas 卡住也强制复位
  requestAnimationFrame(()=>{
    html2canvas(sheet,{backgroundColor:'#ffffff',scale:3,logging:false,useCORS:true})
      .then(canvas=>{ const a=document.createElement('a'); a.download='星名_'+o.name+'.png'; a.href=canvas.toDataURL('image/png'); a.click(); })
      .catch(()=>alert('保存失败，请直接截屏分享～'))
      .finally(restore);
  });
}
</script>
</body>
</html>
